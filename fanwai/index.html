const LibState = {section:'my', q:'', folderId:'', favOnly:false, sort:'updated', batch:false, sel:new Set()};

function libFilter(){
  const q = trim(LibState.q).toLowerCase();
  let list = Store.stories.filter(s => (s.section || 'my') === LibState.section);
  if(LibState.folderId) list = list.filter(s => (s.folderId || '') === LibState.folderId);
  if(LibState.favOnly) list = list.filter(s => s.favorite);
  if(q){
    list = list.filter(s => {
      const f = Store.folder(s.folderId);
      const hay = [s.title, s.brainDump, s.notes, storyTagList(s).join(' '),
        f ? f.name : '', s.sourceInfo.sharer, s.sourceInfo.source, s.sourceInfo.author, s.sourceInfo.note,
        (s.promptVersions[s.currentPromptVersion-1] || {}).prompt || ''].join(' ').toLowerCase();
      return hay.indexOf(q) >= 0;
    });
  }
  if(LibState.sort === 'created') list = list.slice().sort((a,b) => b.createdAt - a.createdAt);
  else if(LibState.sort === 'title') list = list.slice().sort((a,b) => String(a.title).localeCompare(String(b.title), 'zh'));
  else list = list.slice().sort((a,b) => b.updatedAt - a.updatedAt);
  return list;
}

  downloadFile(filename || ('fanwai-stories-' + today() + '.json'), JSON.stringify(data, null, 2));

async function importStoriesFromText(text, name){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){
    // 尝试当作 TXT 脑洞导入
    if(trim(text)){
      const s = newStory('shared');
      s.title = (name || '导入的番外').replace(/\.(txt|json)$/i,'');
      s.brainDump = trim(text);
      s.sourceInfo.importedAt = new Date().toISOString();
      await Store.saveStory(s);
      return {ok:1, msg:'已作为纯文本脑洞导入 1 条'};
    }
    throw new Error('文件不是有效的 JSON，也没有可用的文本内容。');
  }
  let arr = [];
  if(Array.isArray(data)) arr = data;
  else if(data && Array.isArray(data.stories)) arr = data.stories;
  else if(data && data.id && (data.brainDump !== undefined || data.tags !== undefined)) arr = [data];
  else throw new Error('这个 JSON 里没有找到番外数据（需要 stories 数组或单条番外对象）。');
  let n = 0;
  for(const raw of arr){
    const s = normalizeStory(raw);
    if(Store.stories.some(x => x.id === s.id)) s.id = uid();
    if(!s.sourceInfo.importedAt) s.sourceInfo.importedAt = new Date().toISOString();
    await Store.saveStory(s);
    n++;
  }
  Store.sortAll();
  return {ok:n, msg:'成功导入 ' + n + ' 条番外'};
}

function presetSummary(p){
  const d = p.data || {}, out = [];
  const tags = [];
  Object.keys(d.tags || {}).forEach(k => (d.tags[k] || []).forEach(t => tags.push(t)));
  if(tags.length) out.push(tags.slice(0, 5).join('、'));
  if(d.length && (d.length.custom || (d.length.target && d.length.target !== '不限'))) out.push((d.length.custom || d.length.target) + ' 字');
  return out.join(' · ') || '空预设';
}

      '<button class="btn sm ghost" data-act="len-clear">清空</button>' +
    '</div>' +
    '<div class="preview"><div class="pv-head">继续写指令' +
      '<span class="btnbar"><button class="btn xs" data-act="len-copy">' + icon('copy','sm') + '复制</button></span></div>' +
      '<div class="pv-body mono" id="len-cont">' + esc(continueInstruction(target, c.noSpace)) + '</div></div>'
  );
  const t = $('#len-text'), g = $('#len-target');
  t.addEventListener('input', debounce(() => { LenState.text = t.value; updateLenStats(); }, 300));
  g.addEventListener('input', debounce(() => { LenState.target = g.value; updateLenStats(); }, 300));
}
function updateLenStats(){
  const scrollY = window.scrollY;
  const active = document.activeElement && document.activeElement.id;
  const pos = document.activeElement && document.activeElement.selectionStart;
  renderLength();
  if(active){ const n = $('#' + active); if(n){ n.focus(); if(pos != null && n.setSelectionRange) try{ n.setSelectionRange(pos, pos); }catch(e){} } }
  window.scrollTo(0, scrollY);
}
function continueInstruction(target, actual){
  let s = CONTINUE_INSTRUCTION;
  if(target && actual && target > actual){
    s += '\n目标篇幅约 ' + target + ' 字，目前正文约 ' + actual + ' 字，还需要大约 ' + (target - actual) + ' 字。不要用总结或时间跳跃压缩剧情，也不要虚报字数。';
  }
  return s;
}

Router.add('/taste', async () => {
  setTitle('口味画像');
  const stories = Store.stories;
  const cnt = new Map(), pairs = new Map();
  stories.forEach(s => {
    const t = storyTagList(s);
    t.forEach(x => cnt.set(x, (cnt.get(x) || 0) + 1));
    for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++){
      const k = [t[i], t[j]].sort().join(' + ');
      pairs.set(k, (pairs.get(k) || 0) + 1);
    }
  });
  const top = Array.from(cnt.entries()).sort((a,b) => b[1]-a[1]).slice(0, 15);

function makeShareCode(kind, data){
  return 'FW1:' + b64encode(JSON.stringify({k:kind, d:data}));
}
function parseShareCode(code){
  const t = trim(code);
  if(t.indexOf('FW1:') !== 0) throw new Error('这不是一个有效的分享码（应该以 FW1: 开头）。');
  let obj;
  try{ obj = JSON.parse(b64decode(t.slice(4))); }
  catch(e){ throw new Error('分享码内容已损坏，无法解析。'); }
  if(!obj || !obj.k) throw new Error('分享码里没有可识别的数据。');
  return obj;
}
async function showShareCode(kind, data, title){
  const code = makeShareCode(kind, data);
  await openModal({
    title: title || '分享码',
    bodyHTML: '<div class="note mb8">把这段码发给朋友，对方在「预设 → 分享码」里粘贴即可导入。</div>' +
      '<textarea class="textarea mono" style="min-height:120px" readonly id="sc-out">' + esc(code) + '</textarea>',
    actions:[{label:'关闭', value:null},{label:'复制', primary:true, collect:() => { copyText(code).then(ok => toast(ok ? '已复制分享码' : '复制失败')); return null; }}]
  });
}
async function importShareCodeFlow(){
  const code = await promptBox('粘贴分享码', '', {multiline:true, placeholder:'FW1:...'});
  if(!trim(code)) return;
  let obj;
  try{ obj = parseShareCode(code); }catch(e){ toast(e.message, 3200); return; }
  if(obj.k === 'preset'){
    const p = obj.d; p.id = uid(); p.order = Store.presets.length; p.createdAt = now();
    await DB.put('presets', p); Store.presets.push(p); renderPresets(); toast('已导入预设「' + p.name + '」');
  }else if(obj.k === 'story'){
    const s = normalizeStory(obj.d); s.id = uid();
    await Store.saveStory(s); toast('已导入番外「' + (trim(s.title) || '未命名') + '」'); nav('/story/' + s.id);
  }else{
    toast('不认识这种分享码类型');
  }
}

/* ============================================================
   18.5 送到喵喵书阁
   两个应用都放在同一个站点下时（例如 GitHub Pages 的 /fanwai/ 与 /read/），
   同源就能共用 localStorage：这边把指令写进书阁的收件箱再跳过去，书阁打开
   就自己收进「指令」，不用来回导文件。不同源（各自本地打开、或换了域名）时
   自动退回导出文件，书阁的「导入」认识同一种格式。
   ============================================================ */
function readerLink(){
  const raw = trim(Store.get('readerUrl', READER_URL_DEFAULT)) || READER_URL_DEFAULT;
  try{ return new URL(raw, location.href); }catch(e){ return null; }
}
function storageUsable(){
  try{
    const k = '__fw_probe__';
    localStorage.setItem(k, '1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
/* 直通的条件：书阁地址跟这里同源，而且 localStorage 真的能写 */
function canHandoff(){
  const u = readerLink();
  return !!u && location.protocol !== 'file:' && u.origin === location.origin && storageUsable();
}
function readerItemFromStory(s){
  const ver = s.promptVersions[s.currentPromptVersion - 1];
  const prompt = ver ? ver.prompt : Compiler.render(s);
  const note = [];
  if(trim(s.brainDump)) note.push('【脑洞】\n' + trim(s.brainDump));
  if(ver && trim(ver.understanding)) note.push('【AI 理解】\n' + trim(ver.understanding));
  if(ver && trim(ver.direction)) note.push('【番外方向】\n' + trim(ver.direction));
  return {
    kind:'instruction',
    id:'fw-' + s.id,                       // 稳定 id：改完再送是更新，不会堆重复指令
    title: trim(s.title) || autoTitle(s),
    prompt: prompt,
    note: note.join('\n\n'),
    tags: storyTagList(s),
    source:{app:'fanwai', storyId:s.id, version:s.currentPromptVersion || 0, sentAt:now()}
  };
}
function queueForReader(items){
  let list = [];
  try{
    const raw = localStorage.getItem(READER_INBOX_KEY);
    if(raw){
      const data = JSON.parse(raw);
      const prev = Array.isArray(data) ? data : (data && data.items);
      if(Array.isArray(prev)) list = prev;
    }
  }catch(e){ list = []; }          // 收件箱里是坏数据就直接覆盖掉
  items.forEach(it => {
    const i = list.findIndex(x => x && x.id === it.id);
    if(i >= 0) list[i] = it; else list.push(it);
  });
  if(list.length > READER_INBOX_MAX) list = list.slice(-READER_INBOX_MAX);
  localStorage.setItem(READER_INBOX_KEY, JSON.stringify({type:'fanwai-to-meow', v:1, sentAt:now(), items:list}));
}
async function sendToReader(stories){
  const list = (stories || []).filter(Boolean);
  if(!list.length){ toast('没有可以送的番外'); return; }
  const items = list.map(readerItemFromStory);
  if(!canHandoff()){
    downloadFile('fanwai-to-meow-' + today() + '.json',
      JSON.stringify({type:'fanwai-to-meow', v:1, sentAt:now(), items:items}, null, 2));
    await openModal({
      title:'已导出交接文件',
      bodyHTML:'<div class="note">这两个应用现在不在同一个网址下，没法直接送过去，已经导出成文件。<br><br>' +
        '到喵喵书阁的「设置 → 数据备份 → 导入」选这个文件就行，它认识这种格式，会直接建成指令。<br><br>' +
        '想要点一下就到：把两个应用放在同一个站点下（例如 GitHub Pages 的 <code>/fanwai/</code> 和 <code>/read/</code>），' +
        '再到「数据备份 → 送到喵喵书阁」里把书阁地址填对。</div>',
      actions:[{label:'知道了', value:null, primary:true}]
    });
    return;
  }
  try{
    queueForReader(items);
  }catch(e){
    toast('写不进书阁的收件箱：' + (e.message || '浏览器不让存'), 3600);
    return;
  }
  const u = readerLink();
  u.hash = '#inbox';
  const w = window.open(u.href, 'meow-reader');
  if(w){
    try{ w.focus(); }catch(e){}
    toast('已送出 ' + items.length + ' 条，书阁那边直接收');
  }else{
    toast('已放进书阁的收件箱，打开书阁就能看到（浏览器拦了新标签页）', 3600);
  }
}

async function moveStoreItem(storeKey, id, dir, rerender){
  const arr = Store[storeKey];
  const i = arr.findIndex(x => x.id === id);
  if(i < 0) return;
  moveItem(arr, i, dir);
  await DB.bulkPut(storeKey === 'prompts' ? 'prompts' : storeKey, arr);
  rerender();
}

    const a = Store.apis.find(x => x.id === el.dataset.id);
    if(!await confirmBox('删除配置', '确定删除「' + a.name + '」？', '删除', true)) return;
    Store.apis = Store.apis.filter(x => x.id !== a.id); await DB.del('apiConfigs', a.id);
    if(Store.get('activeApiId') === a.id) await Store.set('activeApiId', (Store.apis[0] || {}).id);
    renderApi(); toast('已删除');
  },
  async 'api-test'(el){
    const a = Store.apis.find(x => x.id === el.dataset.id);
    toast('正在测试…');
    try{
      const r = await Api.chat([{role:'user', content:'回复两个字：可用'}], a, {max_tokens:16});
      await openModal({title:'连接成功', bodyHTML:'<div class="note">模型回复：</div><div class="callout mt8">' + esc(trim(r).slice(0,200)) + '</div>',
        actions:[{label:'好', value:null, primary:true}]});
    }catch(e){
      await openModal({title:'连接失败', bodyHTML:'<div class="callout warn">' + esc(e.message) + '</div>',
        actions:[{label:'知道了', value:null, primary:true}]});
    }
  },
  async 'api-export'(){
    downloadFile('fanwai-api-configs.json', JSON.stringify({type:'fanwai-apis', version:1, note:'导出不含 API Key',
      apis: Store.apis.map(a => Object.assign(clone(a), {apiKey:''}))}, null, 2));
    toast('已导出（不含 Key）');
  },
  async 'api-import'(){
    const f = await readFile('.json');
    if(!f) return;
    try{
      const data = JSON.parse(f.text);
      const arr = Array.isArray(data) ? data : data.apis;
      if(!Array.isArray(arr)) throw new Error('文件里没有 apis 数组。');
      let n = 0;
      for(const raw of arr){
        if(!raw || !trim(raw.name)) continue;
        const a = {id:uid(), name:trim(raw.name), provider:String(raw.provider || ''), baseUrl:String(raw.baseUrl || ''),
          apiKey:String(raw.apiKey || ''), model:String(raw.model || ''), temperature:Number(raw.temperature) || 0.7,
          maxTokens:Number(raw.maxTokens) || 4096, customParams:String(raw.customParams || ''),
          models: Array.isArray(raw.models) ? raw.models.filter(x => typeof x === 'string') : [],
          order:Store.apis.length, createdAt:now()};
        Store.apis.push(a); await DB.put('apiConfigs', a); n++;
      }
      renderApi(); toast('导入了 ' + n + ' 个配置');
    }catch(e){ toast('导入失败：' + e.message, 4000); }
  },

  /* ---- 篇幅检测 ---- */
  async 'len-count'(){ updateLenStats(); toast('已重新统计'); },
  async 'len-continue'(){ updateLenStats(); toast('已生成继续写指令'); },
  async 'len-copy'(){
    const c = countText(LenState.text);
    const ok = await copyText(continueInstruction(Number(trim(LenState.target)) || 0, c.noSpace));
    toast(ok ? '已复制继续写指令' : '复制失败');
  },
  async 'len-clear'(){ LenState.text = ''; renderLength(); },

  /* ---- 数据备份 ---- */
  async 'data-export'(){
    const dump = {type:'fanwai-backup', version:1, exportedAt:new Date().toISOString(), data:{}};
    for(const s of DB.STORES) dump.data[s] = await DB.all(s);
    dump.data.apiConfigs = (dump.data.apiConfigs || []).map(a => Object.assign({}, a, {apiKey:''}));
    downloadFile('fanwai-backup-' + today() + '.json', JSON.stringify(dump, null, 2));
    toast('已导出备份（不含 API Key）');
  },
  async 'data-import'(){
    const f = await readFile('.json');
    if(!f) return;
    try{
      const dump = JSON.parse(f.text);
      if(!dump || !dump.data || typeof dump.data !== 'object') throw new Error('这不是本工具导出的备份文件。');
      const mode = await openModal({
        title:'导入备份',
        bodyHTML:'<div class="note">「合并」保留现有数据并追加；「覆盖」会先清空本机全部数据。</div>',
        actions:[{label:'取消', value:null},{label:'合并', value:'merge'},{label:'覆盖', value:'replace', cls:'danger'}]
      });
      if(!mode) return;
      if(mode === 'replace'){ for(const s of DB.STORES) await DB.clear(s); }
      for(const s of DB.STORES){
        const arr = dump.data[s];
        if(!Array.isArray(arr)) continue;
        const rows = arr.filter(x => x && x.id !== undefined);
        if(rows.length) await DB.bulkPut(s, rows);
      }
      Store.settings = {}; await Store.load();
      toast('导入完成'); Router.go();
    }catch(e){ toast('导入失败：' + e.message, 4000); }
  },
  async 'reader-open'(){
    const u = readerLink();
    if(!u){ toast('书阁地址填得不对，解析不出来'); return; }
    window.open(u.href, 'meow-reader');
  },
  async 'reader-reset'(){
    await Store.set('readerUrl', READER_URL_DEFAULT); Router.go(); toast('已恢复默认');
  },
  async 'data-clear'(){
    if(!await confirmBox('清空全部数据', '这台设备上的所有番外、预设、Prompt、词典都会被删除，无法恢复。建议先导出备份。', '仍然清空', true)) return;
    const again = await confirmBox('再确认一次', '真的要清空吗？', '清空', true);
    if(!again) return;
    for(const s of DB.STORES) await DB.clear(s);
    Store.settings = {}; Store.stories = []; Store.prompts = []; Store.templates = []; Store.presets = [];
    Store.apis = []; Store.folders = []; Store.lexicon = []; Store.tagCats = [];
    Cur = null;
    await Store.load();
    toast('已清空'); nav('/');
  },

  /* ---- 详情 ---- */
  async 'detail-copy'(el){
    const s = Store.stories.find(x => x.id === el.dataset.id);
    const v = s.promptVersions[s.currentPromptVersion - 1];
    const ok = await copyText(v ? v.prompt : Compiler.render(s));
    toast(ok ? '已复制' : '复制失败');
  },
  async 'detail-edit'(el){ nav('/story/' + el.dataset.id); },
  async 'detail-export'(el){
    const s = Store.stories.find(x => x.id === el.dataset.id);
    exportStories([s], safeFileName(trim(s.title) || 'story', '.json')); toast('已导出');
  },
  async 'detail-txt'(el){
    const s = Store.stories.find(x => x.id === el.dataset.id);
    const v = s.promptVersions[s.currentPromptVersion - 1];
    const txt = [trim(s.title) || '未命名番外', '', '【脑洞】', trim(s.brainDump) || '(无)', '',
      '【标签】', storyTagList(s).join('、') || '(无)', '', '【Prompt】', v ? v.prompt : Compiler.render(s)].join('\n');
    downloadFile(safeFileName(trim(s.title) || 'story', '.txt'), txt, 'text/plain;charset=utf-8');
    toast('已导出 TXT');
  },
  async 'detail-dup'(el){
    const s0 = Store.stories.find(x => x.id === el.dataset.id);
    const n = normalizeStory(Object.assign(clone(s0), {id:uid(), title:(trim(s0.title) || '未命名') + ' 副本', createdAt:now(), updatedAt:now()}));
    await Store.saveStory(n); toast('已复制一份'); nav('/story/' + n.id);
  },
  async 'detail-send'(el){
    await sendToReader([Store.stories.find(x => x.id === el.dataset.id)]);
  },
  async 'detail-code'(el){
    const s = Store.stories.find(x => x.id === el.dataset.id);
    await showShareCode('story', clone(s), '番外分享码');
  },
  async 'detail-del'(el){
    const s = Store.stories.find(x => x.id === el.dataset.id);
    if(!await confirmBox('删除番外', '确定删除「' + (trim(s.title) || '未命名') + '」？无法恢复。', '删除', true)) return;
    await Store.delStory(s.id); if(Cur && Cur.id === s.id) Cur = null;
    toast('已删除'); nav('/library');
  }
});
GlobalActions['api-use'] = async function(el){
  await Store.set('activeApiId', el.dataset.id); renderApi(); toast('已设为使用中');
};

/* ============================================================
   20. 启动
   ============================================================ */
(async function init(){
  const stamp = $('#build-stamp');
  if(stamp) stamp.textContent = BUILD_VERSION;
  try{
    await Store.load();
  }catch(e){
    document.getElementById('view').innerHTML =
      '<div class="card"><div class="note warn">无法打开本地数据库：' + esc(e.message || e) +
      '<br>如果你在浏览器的无痕模式下，或禁用了本地存储，数据将无法保存。</div></div>';
    return;
  }
  if(!location.hash) location.replace('#/');
  await Router.go();
})();
</script>
<script src="../shell.js" data-tool="fanwai"></script>
</body>
</html>
