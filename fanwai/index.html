<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf9">
<title>番外生成器 · Prompt 编译器</title>
<style>
/* ============================================================
   设计系统 · 极简黑白灰 / 低饱和 / 大量留白 / 细边框
   ============================================================ */
:root{
  --bg:#fbfbfa;
  --surface:#ffffff;
  --surface-2:#f5f5f4;
  --line:#e7e5e4;
  --line-strong:#d6d3d1;
  --text:#1c1917;
  --text-2:#57534e;
  --muted:#a8a29e;
  --accent:#1c1917;
  --accent-soft:#f0efed;
  --danger:#8a5a52;
  --ok:#5a6b5a;
  --radius:10px;
  --radius-sm:7px;
  --pad:16px;
  --maxw:760px;
  --shadow:0 1px 2px rgba(28,25,23,.04);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
}
/* 深色：跟随系统；宿主显式指定 data-theme 时以它为准 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131211; --surface:#1a1918; --surface-2:#222120; --line:#2e2c2a; --line-strong:#3d3a37;
    --text:#ecebe9; --text-2:#b5b0ab; --muted:#7c7773; --accent:#ecebe9; --accent-soft:#2a2827;
    --danger:#c39a92; --ok:#9db09d; --shadow:none;
  }
}
:root[data-theme="dark"]{
    --bg:#131211; --surface:#1a1918; --surface-2:#222120; --line:#2e2c2a; --line-strong:#3d3a37;
    --text:#ecebe9; --text-2:#b5b0ab; --muted:#7c7773; --accent:#ecebe9; --accent-soft:#2a2827;
    --danger:#c39a92; --ok:#9db09d; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  font-size:15px; line-height:1.7; letter-spacing:.01em;
  -webkit-font-smoothing:antialiased; overflow-wrap:break-word;
}
a{color:inherit}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent-soft)}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* 布局 */
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.page{flex:1;padding:20px 0 120px}
.hidden{display:none !important}

/* 顶栏 */
header.topbar{
  position:sticky;top:0;z-index:60;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(120%) blur(10px); border-bottom:1px solid var(--line);
}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:52px}
.topbar .tb-title{font-size:14px;font-weight:600;letter-spacing:.04em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .tb-sub{font-size:11px;color:var(--muted);font-weight:400;margin-left:8px}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
  border:1px solid transparent;background:transparent;border-radius:var(--radius-sm);cursor:pointer;color:var(--text-2);
  flex:none;
}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn:active{transform:scale(.96)}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:15px;height:15px}
.icon.lg{width:22px;height:22px}

/* 抽屉导航 */
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:250px;max-width:82vw;background:var(--surface);
  border-left:1px solid var(--line);z-index:81;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;padding:14px 0;overflow:auto;
}
.drawer.on{transform:none}
.drawer .dtitle{font-size:11px;color:var(--muted);letter-spacing:.12em;padding:10px 20px 6px;text-transform:uppercase}
.drawer a.dlink{
  display:flex;align-items:center;gap:11px;padding:11px 20px;text-decoration:none;color:var(--text-2);font-size:14px;
}
.drawer a.dlink:hover{background:var(--surface-2);color:var(--text)}
.drawer a.dlink.on{color:var(--text);font-weight:600}
.drawer a.dlink.on .icon{color:var(--text)}

/* 卡片 / 区块 */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--pad);margin-bottom:14px;box-shadow:var(--shadow);
}
.card.tight{padding:12px}
.card.flat{background:transparent;border-style:dashed;box-shadow:none}
.sec-title{font-size:12px;letter-spacing:.1em;color:var(--muted);margin:26px 0 10px;font-weight:600}
.sec-title:first-child{margin-top:0}
.hr{height:1px;background:var(--line);border:0;margin:16px 0}

/* 折叠面板 */
.fold{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden}
.fold>summary{
  list-style:none;cursor:pointer;padding:14px var(--pad);display:flex;align-items:center;gap:10px;
  font-size:14px;font-weight:600;user-select:none;
}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.fold[open]>summary .chev{transform:rotate(90deg)}
.fold>summary .sum-note{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
.fold>summary .sum-note+.chev{margin-left:8px}
.fold .fold-body{padding:2px var(--pad) var(--pad);border-top:1px solid var(--line)}

/* 表单 */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
label.lb{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;letter-spacing:.03em}
label.lb .hint{color:var(--muted);font-size:11px;margin-left:6px}
.input,.textarea,select.input{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:10px 12px;outline:none;transition:border-color .15s;
}
.input:focus,.textarea:focus,select.input:focus{border-color:var(--line-strong)}
.textarea{resize:vertical;min-height:88px;line-height:1.75}
.textarea.big{min-height:150px}
.textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.65}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) calc(50% + 1px),calc(100% - 11px) calc(50% + 1px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.row.tight{gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  padding:9px 15px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;
  transition:background .15s,border-color .15s,transform .08s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.primary:hover{opacity:.88;background:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2);padding:8px 10px}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:6px 11px;font-size:12.5px;gap:5px}
.btn.xs{padding:4px 9px;font-size:12px;gap:4px;border-radius:6px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.block{width:100%}
.btnbar{display:flex;gap:8px;flex-wrap:wrap}
.btnbar.end{justify-content:flex-end}

/* 标签 chip */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);
  color:var(--text-2);padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;
  transition:all .14s;user-select:none;
}
.chip:hover{border-color:var(--line-strong);color:var(--text)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip.on .icon{color:var(--bg)}
.chip.mini{font-size:12px;padding:3px 9px}
.chip.static{cursor:default}
.chip .x{display:inline-flex;opacity:.5}
.chip .x:hover{opacity:1}
.chip.add{border-style:dashed;color:var(--muted)}

/* 滑块 */
.slider-row{margin-bottom:16px}
.slider-head{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:2px}
.slider-head .sname{font-weight:500}
.slider-head .sval{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slider-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-2px}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line-strong);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--surface);border:1.5px solid var(--text);margin-top:-6.5px}
input[type=range]::-moz-range-track{height:2px;background:var(--line-strong);border-radius:2px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--surface);border:1.5px solid var(--text)}
input[type=range].off::-webkit-slider-thumb{border-color:var(--muted)}

/* 开关 */
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:6px 0}
.switch .track{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .18s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--surface);transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.switch input{display:none}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch .sw-label{font-size:13.5px}
.switch .sw-desc{font-size:11.5px;color:var(--muted);line-height:1.5}

/* 列表项 */
.item{
  display:flex;align-items:center;gap:12px;padding:13px var(--pad);border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);margin-bottom:9px;cursor:pointer;transition:border-color .15s;
}
.item:hover{border-color:var(--line-strong)}
.item .it-main{flex:1;min-width:0}
.item .it-title{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .it-sub{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .it-actions{display:flex;gap:2px;flex:none}
.item.selected{border-color:var(--text)}

/* 首页大入口 */
.hero{padding:34px 0 10px}
.hero h1{font-size:26px;line-height:1.45;margin:0 0 10px;font-weight:600;letter-spacing:.01em}
.hero p{margin:0;color:var(--muted);font-size:14px}
.entries{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 6px}
.entry{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;
  cursor:pointer;transition:border-color .15s,transform .08s;text-align:left;
}
.entry:hover{border-color:var(--line-strong)}
.entry:active{transform:scale(.99)}
.entry .en-ic{color:var(--text-2);margin-bottom:10px;display:block}
.entry .en-t{font-size:15px;font-weight:600}
.entry .en-d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.entry.wide{grid-column:1 / -1}

/* 提示 / 空态 */
.empty{text-align:center;padding:46px 20px;color:var(--muted);font-size:13.5px}
.empty .icon{margin-bottom:12px;opacity:.5}
.note{font-size:12px;color:var(--muted);line-height:1.65}
.note.warn{color:var(--danger)}
.callout{border:1px solid var(--line);border-left:2px solid var(--line-strong);background:var(--surface-2);
  padding:11px 13px;border-radius:var(--radius-sm);font-size:12.5px;color:var(--text-2);line-height:1.7;margin-bottom:12px}
.callout.warn{border-left-color:var(--danger)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.badge.solid{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* 预览区 */
.preview{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden;
}
.preview .pv-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);
  font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.preview .pv-head .btnbar{margin-left:auto}
.preview .pv-body{padding:14px;white-space:pre-wrap;font-size:13.5px;line-height:1.85;color:var(--text-2);
  max-height:420px;overflow:auto}
.preview .pv-body.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.7;color:var(--text)}

/* 模态 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;display:flex;align-items:center;justify-content:center;
  padding:16px;opacity:0;pointer-events:none;transition:opacity .16s}
.modal-mask.on{opacity:1;pointer-events:auto}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:480px;
  max-height:86vh;display:flex;flex-direction:column;transform:translateY(8px);transition:transform .18s;
}
.modal-mask.on .modal{transform:none}
.modal .m-head{padding:16px var(--pad) 8px;font-size:15px;font-weight:600}
.modal .m-body{padding:6px var(--pad) 14px;overflow:auto;font-size:13.5px;color:var(--text-2);line-height:1.7}
.modal .m-foot{padding:12px var(--pad) 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* toast */
#toaster{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));z-index:120;display:flex;
  flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  background:var(--accent);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;
  box-shadow:0 4px 14px rgba(0,0,0,.14);animation:tin .2s ease-out;max-width:88vw;text-align:center;
}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 底部固定操作条 */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%, transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));
}
.actionbar .wrap{display:flex;gap:8px;padding:0}
.actionbar .btn{flex:1}

/* 搜索栏 */
.searchbar{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--surface);padding:0 12px;margin-bottom:12px}
.searchbar input{border:0;background:transparent;outline:none;padding:10px 0;flex:1;min-width:0}
.searchbar .icon{color:var(--muted);flex:none}

/* 标签页 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 13px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:1.5px solid transparent;
  margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}

/* 关系图谱 */
.rel-line{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rel-line select.input{flex:0 1 118px}
.rel-line input.input{flex:2 1 150px}

/* 统计 */
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1;min-width:88px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px;background:var(--surface)}
.stat .sv{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .sl{font-size:11px;color:var(--muted);margin-top:2px}

/* 拖拽排序 */
.sortable .item{cursor:default}
.drag-handle{cursor:grab;color:var(--muted);touch-action:none}
.item.dragging{opacity:.4}
.item.dragover{border-color:var(--text)}

/* 版本 */
.ver-list{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ver{border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--text-2)}
.ver.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* 冲突提示 */
.conflict{border:1px solid color-mix(in srgb,var(--danger) 30%,var(--line));background:color-mix(in srgb,var(--danger) 6%,transparent);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;line-height:1.7;margin-bottom:10px}

/* 复选 */
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;user-select:none}
.check input{display:none}
.check .box{width:17px;height:17px;border:1px solid var(--line-strong);border-radius:4px;display:inline-flex;
  align-items:center;justify-content:center;flex:none;transition:all .14s}
.check input:checked+.box{background:var(--accent);border-color:var(--accent)}
.check input:checked+.box::after{content:"";width:9px;height:5px;border-left:1.6px solid var(--bg);
  border-bottom:1.6px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}

.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.tar{text-align:right}.tac{text-align:center}
.fs12{font-size:12px}.fs13{font-size:13px}
.muted{color:var(--muted)}
.nowrap{white-space:nowrap}
</style>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

"use strict";
/* ============================================================
   0. 基础工具
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const now = () => Date.now();
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = (o) => JSON.parse(JSON.stringify(o));
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function attr(s){ return esc(s); }
function trim(s){ return String(s == null ? '' : s).trim(); }
function nonEmpty(arr){ return (arr || []).map(trim).filter(Boolean); }
function uniq(arr){ return Array.from(new Set(arr)); }
function fmtDate(ts){
  if(!ts) return '';
  const d = new Date(ts), p = (n) => String(n).padStart(2,'0');
  const today = new Date();
  const sameDay = d.toDateString() === today.toDateString();
  if(sameDay) return '今天 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function icon(name, cls){ return '<svg class="icon ' + (cls||'') + '"><use href="#i-' + name + '"/></svg>'; }
function debounce(fn, ms){
  let t; const f = function(){ const a = arguments, c = this; clearTimeout(t); t = setTimeout(()=>fn.apply(c,a), ms); };
  f.flush = function(){ clearTimeout(t); };
  return f;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* Unicode 安全的 base64（用于分享码） */
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/=+$/,'');
}
function b64decode(b64){
  const pad = b64.length % 4 ? '='.repeat(4 - b64.length % 4) : '';
  const bin = atob(b64.replace(/-/g,'+').replace(/_/g,'/') + pad);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---- toast ---- */
function toast(msg, ms){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toaster').appendChild(t);
  setTimeout(() => { t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),320); }, ms || 1900);
}

/* ---- modal ---- */
let _modalResolve = null;
function closeModal(val){
  $('#modal-mask').classList.remove('on');
  if(_modalResolve){ const r = _modalResolve; _modalResolve = null; r(val); }
}
function openModal(opts){
  // opts: {title, bodyHTML, actions:[{label, value, cls, primary}], onMount(root)}
  return new Promise((resolve) => {
    _modalResolve = resolve;
    const m = $('#modal');
    const acts = (opts.actions || [{label:'关闭', value:null}]).map((a,i) =>
      '<button class="btn ' + (a.cls || (a.primary ? 'primary' : '')) + '" data-mi="' + i + '">' + esc(a.label) + '</button>').join('');
    m.innerHTML =
      (opts.title ? '<div class="m-head">' + esc(opts.title) + '</div>' : '') +
      '<div class="m-body">' + (opts.bodyHTML || '') + '</div>' +
      '<div class="m-foot">' + acts + '</div>';
    $('#modal-mask').classList.add('on');
    $$('#modal [data-mi]').forEach(b => b.addEventListener('click', () => {
      const a = (opts.actions || [{value:null}])[+b.dataset.mi];
      let v = a.value;
      if(typeof a.collect === 'function'){ v = a.collect(m); if(v === undefined) return; }
      closeModal(v);
    }));
    if(opts.onMount) opts.onMount(m);
    const f = m.querySelector('[data-autofocus]');
    if(f) setTimeout(()=>{ f.focus(); if(f.select) f.select(); }, 60);
  });
}
function confirmBox(title, msg, okLabel, danger){
  return openModal({
    title: title,
    bodyHTML: '<div>' + esc(msg || '') + '</div>',
    actions: [
      {label:'取消', value:false},
      {label: okLabel || '确定', value:true, cls: danger ? 'danger' : 'primary'}
    ]
  });
}
function promptBox(title, initial, opts){
  opts = opts || {};
  const multi = opts.multiline;
  const body = (opts.desc ? '<div class="note mb12">' + esc(opts.desc) + '</div>' : '') +
    (multi
      ? '<textarea class="textarea big" data-autofocus id="mp-in">' + esc(initial||'') + '</textarea>'
      : '<input class="input" data-autofocus id="mp-in" value="' + attr(initial||'') + '" placeholder="' + attr(opts.placeholder||'') + '">');
  return openModal({
    title: title,
    bodyHTML: body,
    actions: [
      {label:'取消', value:null},
      {label:'确定', primary:true, collect:(m)=>{ const v = $('#mp-in', m).value; return opts.allowEmpty ? v : (trim(v) ? v : undefined); }}
    ]
  });
}

/* ---- 文件下载 / 读取 ---- */
/* 文件名统一用 ASCII，避免部分浏览器丢弃非 ASCII 的 download 名称 */
function safeFileName(base, ext){
  let b = String(base || '').replace(/[^\x20-\x7E]/g, '').replace(/[\\/:*?"<>|]/g,'').trim().replace(/\s+/g,'-');
  if(!b) b = 'fanwai';
  return b + ext;
}
function today(){ return new Date().toISOString().slice(0,10); }
/* 在 Claude Artifact 这类沙箱里，普通的下载链接是无效的：那里要走宿主提供的
   保存流程。其它环境（本地打开、GitHub Pages）没有 window.claude，照旧下载。 */
let _hostSave = undefined;
async function hostDownloads(){
  if(_hostSave !== undefined) return _hostSave;
  _hostSave = null;
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      _hostSave = await window.claude.use('downloads');
    }
  }catch(e){ _hostSave = null; }
  return _hostSave;
}
async function downloadFile(filename, text, mime){
  const host = await hostDownloads();
  if(host){
    try{
      await host.save({filename: filename, data: text});
    }catch(err){
      const code = err && err.code;
      if(code === 'declined') return;            // 用户自己点了取消，不是错误
      toast('没能保存文件：' + ((err && err.message) || '这个环境不允许保存'), 3600);
    }
    return;
  }
  const blob = new Blob([text], {type: mime || 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function readFile(accept){
  return new Promise((resolve) => {
    const inp = $('#file-input');
    if(accept) inp.setAttribute('accept', accept);
    inp.value = '';
    const onChange = () => {
      inp.removeEventListener('change', onChange);
      const f = inp.files && inp.files[0];
      if(!f){ resolve(null); return; }
      const r = new FileReader();
      r.onload = () => resolve({name: f.name, text: String(r.result)});
      r.onerror = () => { toast('文件读取失败'); resolve(null); };
      r.readAsText(f, 'utf-8');
    };
    inp.addEventListener('change', onChange);
    inp.click();
  });
}
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){ /* 回退 */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* ============================================================
   1. IndexedDB 封装
   ============================================================ */
const DB = (function(){
  const NAME = 'fanwai-db', VERSION = 1;
  const STORES = ['stories','prompts','promptTemplates','presets','apiConfigs','folders','settings','lexicon','tagpool'];
  let _db = null;
  function open(){
    if(_db) return Promise.resolve(_db);
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(NAME, VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        STORES.forEach(s => { if(!db.objectStoreNames.contains(s)) db.createObjectStore(s, {keyPath:'id'}); });
      };
      req.onsuccess = () => { _db = req.result; resolve(_db); };
      req.onerror = () => reject(req.error || new Error('无法打开本地数据库'));
    });
  }
  function tx(store, mode){
    return open().then(db => db.transaction(store, mode).objectStore(store));
  }
  function wrap(request){
    return new Promise((res, rej) => { request.onsuccess = () => res(request.result); request.onerror = () => rej(request.error); });
  }
  return {
    STORES,
    open,
    async all(store){ const s = await tx(store,'readonly'); return (await wrap(s.getAll())) || []; },
    async get(store, id){ const s = await tx(store,'readonly'); return await wrap(s.get(id)); },
    async put(store, obj){ const s = await tx(store,'readwrite'); await wrap(s.put(obj)); return obj; },
    async bulkPut(store, arr){
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction(store, 'readwrite'), os = t.objectStore(store);
        arr.forEach(o => os.put(o));
        t.oncomplete = () => res(arr.length); t.onerror = () => rej(t.error);
      });
    },
    async del(store, id){ const s = await tx(store,'readwrite'); await wrap(s.delete(id)); },
    async clear(store){ const s = await tx(store,'readwrite'); await wrap(s.clear()); },
    async setting(key, value){
      if(value === undefined){ const r = await DB.get('settings', key); return r ? r.value : undefined; }
      await DB.put('settings', {id:key, value:value}); return value;
    }
  };
})();

/* ============================================================
   3. 数据仓库（内存缓存 + IndexedDB 持久化）
   ============================================================ */
const Store = {
  settings:{}, tagCats:[], lexicon:[], prompts:[], templates:[], presets:[], apis:[], folders:[], stories:[],

  async set(key, value){ this.settings[key] = value; await DB.setting(key, value); return value; },
  get(key, fallback){ return this.settings[key] === undefined ? fallback : this.settings[key]; },

  async load(){
    await DB.open();
    const rows = await DB.all('settings');
    rows.forEach(r => { this.settings[r.id] = r.value; });
    this.tagCats   = await DB.all('tagpool');
    this.lexicon   = await DB.all('lexicon');
    this.prompts   = await DB.all('prompts');
    this.templates = await DB.all('promptTemplates');
    this.presets   = await DB.all('presets');
    this.apis      = await DB.all('apiConfigs');
    this.folders   = await DB.all('folders');
    this.stories   = await DB.all('stories');
    await this.seed();
    this.sortAll();
  },
  sortAll(){
    const byOrder = (a,b) => (a.order||0) - (b.order||0) || (a.createdAt||0) - (b.createdAt||0);
    this.tagCats.sort(byOrder); this.prompts.sort(byOrder); this.templates.sort(byOrder);
    this.presets.sort(byOrder); this.folders.sort(byOrder); this.apis.sort(byOrder);
    this.stories.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
  },
  async seed(){
    if(!this.tagCats.length){
      this.tagCats = DEFAULT_TAG_CATEGORIES.map((c,i) => ({
        id:'cat_'+c.key, key:c.key, name:c.name, builtin:true, order:i,
        tags:c.tags.slice(), createdAt:now()
      }));
      await DB.bulkPut('tagpool', this.tagCats);
    }
    if(!this.lexicon.length){
      this.lexicon = DEFAULT_LEXICON.map((p,i) => ({id:'lex_'+i, tag:p[0], meaning:p[1], builtin:true, order:i, createdAt:now()}));
      await DB.bulkPut('lexicon', this.lexicon);
    }
    if(!this.templates.length){
      const t = {
        id:'tpl_default', name:'默认模板', builtin:true, order:0,
        mode:'wrap', head:'', tail:'', body: DEFAULT_TEMPLATE_BODY, createdAt:now(), updatedAt:now(),
        desc:'没有额外的固定开头结尾，直接输出本次番外的内容。'
      };
      const t2 = {
        id:'tpl_expanded', name:'分块展开模板', builtin:true, order:1,
        mode:'advanced', head:'', tail:'', body: TEMPLATE_BODY_EXPANDED, createdAt:now(), updatedAt:now(),
        desc:'高级：手动排布各个变量块。空的变量会自动省略。'
      };
      this.templates = [t, t2];
      await DB.bulkPut('promptTemplates', this.templates);
    }
    if(!this.folders.length){
      const base = [
        {name:'恋爱', section:'my'}, {name:'AU', section:'my'}, {name:'群像', section:'my'}, {name:'未分类', section:'my'},
        {name:'宝藏梗', section:'shared'}, {name:'别人推荐', section:'shared'}, {name:'AU', section:'shared'}, {name:'未分类', section:'shared'}
      ];
      this.folders = base.map((f,i) => ({id:uid(), name:f.name, section:f.section, order:i, createdAt:now()}));
      await DB.bulkPut('folders', this.folders);
    }
    /* 不预置任何示例预设：预设是各人自己的一整套配置，塞一个进去只会碍事。
       之前版本装过的那条示例，在这里一次性清掉，清完做标记，不会再回来。 */
    if(this.settings.demoPresetRemoved !== true){
      const demo = this.presets.find(x => x.id === 'preset_default_1');
      if(demo){
        this.presets = this.presets.filter(x => x.id !== 'preset_default_1');
        await DB.del('presets', 'preset_default_1');
      }
      await this.set('demoPresetRemoved', true);
    }
    if(this.settings.openingCommand === undefined) await this.set('openingCommand', OPENING_DEFAULT);
    if(this.settings.openingExtra === undefined)   await this.set('openingExtra', OPENING_EXTRA_DEFAULT);
    if(this.settings.openingExtraOn === undefined) await this.set('openingExtraOn', false);
    if(this.settings.modules === undefined)        await this.set('modules', clone(DEFAULT_MODULES));
    if(this.settings.sliderDefs === undefined)     await this.set('sliderDefs', clone(DEFAULT_SLIDERS));
    if(this.settings.narrativeDefs === undefined)  await this.set('narrativeDefs', clone(DEFAULT_NARRATIVE_SLIDERS));
    if(this.settings.activeTemplateId === undefined) await this.set('activeTemplateId', 'tpl_default');
    if(this.settings.compileLevel === undefined)   await this.set('compileLevel', 'polish');
    if(this.settings.promptStyle === undefined)    await this.set('promptStyle', 'natural');
    if(this.settings.useApi === undefined)         await this.set('useApi', false);
    if(this.settings.readerUrl === undefined)      await this.set('readerUrl', READER_URL_DEFAULT);
    if(this.settings.readerOn === undefined)       await this.set('readerOn', false);   // 联动是可选的，默认不出现
  },

  lexMap(){
    const m = new Map();
    this.lexicon.forEach(l => { if(trim(l.tag)) m.set(trim(l.tag), trim(l.meaning)); });
    return m;
  },
  allTags(){
    const out = [];
    this.tagCats.forEach(c => c.tags.forEach(t => out.push({cat:c.key, catName:c.name, tag:t})));
    return out;
  },
  cat(key){ return this.tagCats.find(c => c.key === key); },
  folder(id){ return this.folders.find(f => f.id === id); },
  template(id){ return this.templates.find(t => t.id === id) || this.templates[0]; },
  activeApi(){ return this.apis.find(a => a.id === this.get('activeApiId')) || this.apis[0]; },

  async saveStory(s){
    s.updatedAt = now();
    const i = this.stories.findIndex(x => x.id === s.id);
    if(i >= 0) this.stories[i] = s; else this.stories.unshift(s);
    await DB.put('stories', clone(s));
    return s;
  },
  async delStory(id){
    this.stories = this.stories.filter(s => s.id !== id);
    await DB.del('stories', id);
  }
};

function blankPerson(){
  return {name:'', gender:'未指定', orientation:'未指定', age:'未指定', ageCustom:'',
          identity:'未指定', job:'', social:'', personality:[], temperament:'', extra:''};
}
function newStory(section){
  const st = Store.settings;
  return {
    id: uid(),
    title:'', section: section || 'my', folderId:null,
    brainDump:'',
    opening: st.openingCommand || OPENING_DEFAULT,
    openingExtraOn: st.openingExtraOn !== false,
    openingExtra: st.openingExtra || OPENING_EXTRA_DEFAULT,
    tags:{}, customTags:[],
    characters:{mode:'unspecified', char:blankPerson(), user:blankPerson(), others:[], relations:[]},
    relationship:{current:'未指定', currentCustom:'', sliders:{}, roles:{}},
    world:{era:'未指定', eraCustom:'', type:'未指定', typeCustom:'', social:'未指定', socialCustom:'',
           charIdentity:'', userIdentity:'', scenes:[], sceneCustom:'', literary:[], screen:[], screenFeel:''},
    narrative:{sliders:{}, pov:'未指定', povCustom:'', styles:[], infoGap:'未指定', infoGapCustom:''},
    vibe:{moods:[], custom:''},
    visual:{season:'未指定', time:'未指定', weather:'未指定', tone:'未指定', custom:''},
    ending:'未指定', endingCustom:'',
    extra:{on:false, hooks:[], level:'轻', custom:''},
    refuse:[],
    length:{target:'不限', custom:'', strict:false, segmented:false, countOutput:false},
    customPromptIds:[],
    promptTemplateId: st.activeTemplateId || 'tpl_default',
    compileLevel: st.compileLevel || 'polish',
    promptStyle: st.promptStyle || 'natural',       // natural = 连贯的一段话；structured = 【】分区

    promptVersions:[], currentPromptVersion:0,
    notes:'',
    sourceInfo:{sharer:'', source:'', link:'', importedAt:'', author:'', note:''},
    favorite:false, createdAt: now(), updatedAt: now()
  };
}
/* 补全缺失字段（导入 / 旧数据兼容） */
function normalizeStory(raw){
  const base = newStory(raw && raw.section === 'shared' ? 'shared' : 'my');
  if(!raw || typeof raw !== 'object') return base;
  const out = Object.assign(base, raw);
  out.id = raw.id || base.id;
  out.tags = (raw.tags && typeof raw.tags === 'object' && !Array.isArray(raw.tags)) ? raw.tags : {};
  out.customTags = Array.isArray(raw.customTags) ? raw.customTags : [];
  out.refuse = Array.isArray(raw.refuse) ? raw.refuse : [];
  out.customPromptIds = Array.isArray(raw.customPromptIds) ? raw.customPromptIds : [];
  out.promptVersions = Array.isArray(raw.promptVersions) ? raw.promptVersions : [];
  ['characters','relationship','world','narrative','vibe','visual','extra','length','sourceInfo'].forEach(k => {
    out[k] = Object.assign(clone(base[k]), (raw[k] && typeof raw[k] === 'object') ? raw[k] : {});
  });
  out.characters.char = Object.assign(blankPerson(), out.characters.char || {});
  out.characters.user = Object.assign(blankPerson(), out.characters.user || {});
  out.characters.others = Array.isArray(out.characters.others) ? out.characters.others : [];
  out.characters.relations = Array.isArray(out.characters.relations) ? out.characters.relations : [];
  out.createdAt = raw.createdAt || now();
  out.updatedAt = raw.updatedAt || now();
  return out;
}
/* 选中标签工具 */
function storyTagList(s){
  const out = [];
  Object.keys(s.tags || {}).forEach(k => (s.tags[k] || []).forEach(t => out.push(t)));
  (s.customTags || []).forEach(t => out.push(t));
  return uniq(out.map(trim).filter(Boolean));
}
function toggleTag(s, catKey, tag){
  if(!s.tags[catKey]) s.tags[catKey] = [];
  const i = s.tags[catKey].indexOf(tag);
  if(i >= 0) s.tags[catKey].splice(i,1); else s.tags[catKey].push(tag);
}

function band(v){ return v < 34 ? 'low' : (v > 66 ? 'high' : 'mid'); }
function degreeWord(v){ return v < 20 ? '很低' : v < 40 ? '偏低' : v < 60 ? '中等' : v < 80 ? '偏高' : '很高'; }

const Compiler = (function(){

  function nameA(s){ return trim(s.characters.char.name) || 'CHAR'; }
  function nameB(s){ return trim(s.characters.user.name) || 'USER'; }
  function roleName(s, v){
    if(v === 'A') return nameA(s);
    if(v === 'B') return nameB(s);
    if(v === '双方') return '双方';
    return '';
  }
  function block(title, lines){
    const body = (Array.isArray(lines) ? lines : [lines]).map(trim).filter(Boolean);
    if(!body.length) return '';
    return '【' + title + '】\n' + body.join('\n');
  }
  function val(v){ const t = trim(v); return (!t || t === '未指定') ? '' : t; }
  function orCustom(v, custom){ return val(custom) || val(v); }

  /* ---------- 人物 ---------- */
  function personLine(s, label, p){
    const bits = [];
    const g = val(p.gender); if(g) bits.push('性别：' + g);
    const o = val(p.orientation); if(o) bits.push('性取向：' + o);
    const a = orCustom(p.age, p.ageCustom); if(a) bits.push('年龄阶段：' + a);
    const id = orCustom(p.identity, p.identityCustom); if(id) bits.push('身份：' + id);
    const j = val(p.job); if(j) bits.push('职业：' + j);
    const so = val(p.social); if(so) bits.push('社会位置：' + so);
    const per = nonEmpty(p.personality); if(per.length) bits.push('性格：' + per.join('、'));
    const tem = val(p.temperament); if(tem) bits.push('气质：' + tem);
    const ex = val(p.extra); if(ex) bits.push('补充：' + ex);
    if(!bits.length && !val(p.name)) return '';
    const nm = val(p.name) ? (label + '（' + val(p.name) + '）') : label;
    return nm + '：' + (bits.length ? bits.join('；') : '其余设定沿用当前上下文，不要另行补充');
  }
  function buildCharacters(s){
    const c = s.characters, lines = [];
    const mode = c.mode;
    if(mode === 'group') lines.push('本次番外是群像，多个角色共同承担叙事，不要把重心压缩到某一对关系上。');
    else if(mode === 'multi') lines.push('本次番外包含多个角色，请让每个出场角色都有自己的目的与反应。');
    else if(mode === 'single') lines.push('本次番外以单个角色为中心。');
    const a = personLine(s, 'CHAR', c.char);
    const b = personLine(s, 'USER', c.user);
    if(a) lines.push(a);
    if(b) lines.push(b);
    (c.others || []).forEach(o => {
      const bits = [];
      if(val(o.gender)) bits.push('性别：' + val(o.gender));
      if(val(o.age)) bits.push('年龄阶段：' + val(o.age));
      if(val(o.identity)) bits.push('身份：' + val(o.identity));
      if(val(o.job)) bits.push('职业：' + val(o.job));
      if(nonEmpty(o.personality).length) bits.push('性格：' + nonEmpty(o.personality).join('、'));
      if(val(o.relation)) bits.push('与主要角色的关系：' + val(o.relation));
      if(val(o.extra)) bits.push('补充：' + val(o.extra));
      if(val(o.name) || bits.length) lines.push('其他角色' + (val(o.name) ? '（' + val(o.name) + '）' : '') + '：' + (bits.join('；') || '细节未指定'));
    });

    if(rels.length){
      const names = personNameMap(s);
      rels.forEach(r => {
        const f = names[r.from] || r.from, t = names[r.to] || r.to;
        if(f && t) lines.push('关系设定：' + f + ' 对 ' + t + ' —— ' + trim(r.desc));

    lines.push('以上没有写到的内容保持未知，不要补充成设定。不要根据性别、性取向、职业、身份或社会位置推导任何角色的性格、能力、体力、智力、责任感或主导程度。');
    return block('人物', lines);
  }
  function personNameMap(s){
    const m = {CHAR: nameA(s), USER: nameB(s)};
    (s.characters.others || []).forEach(o => { m[o.id] = trim(o.name) || '其他角色'; });
    return m;
  }

  /* ---------- 世界 ---------- */
  function buildWorld(s){
    const w = s.world, lines = [];
    const era = orCustom(w.era, w.eraCustom); if(era) lines.push('时代：' + era);
    const wt = orCustom(w.type, w.typeCustom); if(wt) lines.push('世界类型：' + wt);
    const so = orCustom(w.social, w.socialCustom); if(so) lines.push('社会结构 / 身份差：' + so);

  function splitList(str){
    return String(str || '').split(/[,，、;；\n]/).map(trim).filter(Boolean);
  }

  /* ---------- 关系与情绪 ---------- */
  function buildRelationship(s){
    const r = s.relationship, lines = [];
    const cur = orCustom(r.current, r.currentCustom);
    if(cur) lines.push('两人当前的关系是：' + cur + '。番外从这个关系状态开始。');
    const defs = Store.get('sliderDefs', DEFAULT_SLIDERS);

      const cfg = (r.sliders || {})[d.key];
      if(!cfg || !cfg.on) return;
      const v = typeof cfg.value === 'number' ? cfg.value : d.value;
      if(d.key === 'initiative'){
        const who = v < 35 ? nameA(s) : (v > 65 ? nameB(s) : null);

          : '两人在关系中的主动权大致均衡，推进与退让交替发生。');
        return;
      }
      const t = SLIDER_TEXT[d.key];
      if(t) lines.push(t[band(v)]);
      else lines.push('「' + d.name + '」这一项的强度' + degreeWord(v) + '（更接近「' + (v > 50 ? d.max : d.min) + '」）' + (trim(d.desc) ? '：' + trim(d.desc) : '') + '，请让它自然体现在人物行为与互动中，不要直接说明。');

      const v = (r.roles || {})[q.key];

  function translateTags(s){

      const m = lex.get(t);

      else plain.push(t);

    return {translated, plain, tags};
  }

    translated.forEach(x => lines.push('· ' + x.text + (level === 'deep' || level === 'bold' ? '' : '')));

      lines.push('· 另外，请让这些方向自然存在于故事里：' + plain.join('、') + '。把它们理解为整体氛围与走向，而不是需要逐项完成的条目。');

      const t = NARRATIVE_TEXT[d.key];
      if(t) lines.push(t[band(v)]);
      else lines.push('「' + d.name + '」更接近「' + (v > 50 ? d.max : d.min) + '」。');

    const e = orCustom(s.ending, s.endingCustom);
    if(!e) return '';
    return block('结局倾向', ['结局倾向：' + e + '。收尾要由剧情自然导向，不要为了达成结局强行转折。']);
  }
  function buildExtra(s, level){
    const x = s.extra;
    if(!x || !x.on) return '';
    const hooks = nonEmpty(x.hooks).concat(splitList(x.custom));
    if(!hooks.length && level !== 'bold') return '';
    const lv = x.level || '轻';
    const strength = lv === '轻' ? '幅度要小，只作为点缀' : (lv === '中' ? '可以形成一个小的转折，但不要改变故事重心' : '可以大胆一些，允许出现意料之外的发展');
    const lines = [];
    lines.push('可以在故事里加入一点额外的东西：' + (hooks.length ? hooks.join('、') : '一个不破坏整体走向的小意外') + '。' + strength + '。');
    lines.push('这些额外元素不能覆盖或违背上面已经明确写出的要求。');
    return block('偷偷加一点料', lines);
  }

  /* ---------- 脑洞 ---------- */
  function buildIdea(s, level){
    const raw = trim(s.brainDump);
    if(!raw) return '';
    const lines = [];
    if(level === 'raw'){
      lines.push(raw);
    }else{
      lines.push(raw);
      const core = coreIntent(s);
      if(core && (level === 'deep' || level === 'bold')) lines.push('核心是：' + core);
    }
    lines.push('这是本次番外最重要的部分。上面这段是用户真正想看的内容，优先级高于其它所有标签与设定。可以扩展细节、补充过程，但不要改变它的核心意图，也不要替换成别的走向。');
    return block('我这次想看的', lines);
  }
  function coreIntent(s){
    const {translated, plain} = translateTags(s);
    const raw = trim(s.brainDump);
    const key = translated.slice(0,3).map(t => t.tag).concat(plain.slice(0,2));
    if(!raw && !key.length) return '';
    const parts = [];
    if(raw) parts.push('把上面这个脑洞真正写出来');
    if(key.length) parts.push('并且让「' + key.join('、') + '」这几种感觉在里面成立');
    return parts.join('，') + '。';
  }

  /* ---------- 规则 / 篇幅 / 输出 / 最终检查 ---------- */
  function buildRules(s){
    const lines = [
      '这是一段独立番外，不计入主线剧情。不要修改、覆盖或追加主线事件、人物记忆与关系状态。',
      '番外内部可以拥有独立的时间线、背景与剧情发展；番外结束后回到主线，不要把番外内容自动带回主线。',
      '保持当前角色原本的人格、说话方式、价值观与行为逻辑。番外允许出现新的背景和事件，但不能因此让角色突然 OOC。',
      '没有明确提供的信息不要擅自设定成固定事实。不确定的部分可以模糊处理或留白。'
    ];
    if(s.characters.mode === 'unspecified' || (!trim(s.characters.char.name) && !trim(s.characters.user.name))){
      lines.push('沿用当前上下文中已有的角色，不要凭空替换成别的角色。');
    }
    lines.push('不要默认任何两个角色之间存在恋爱关系，除非上面明确写了。');
    return block('番外执行规则', lines);
  }
  function buildLength(s){
    const L = s.length || {};
    const target = trim(L.custom) || (L.target && L.target !== '不限' ? L.target : '');
    const lines = [];
    if(target){
      lines.push('目标篇幅：约 ' + target + ' 字。');
      if(L.strict){
        lines.push('严格篇幅模式：');
        lines.push('· 把目标字数视为最低完成线，未达到之前不要主动结束。');
        lines.push('· 不要用总结、概括或时间跳跃压缩剧情。');
        lines.push('· 不要用"已经达到要求"之类的说明代替实际输出。');
        lines.push('· 不要虚报字数。');
        lines.push('· 不要靠机械重复内容凑字数。');
        lines.push('· 达到最低篇幅之后，仍然要把剧情正常完成，而不是中途停下。');
      }
      if(L.segmented){
        lines.push('长篇分段模式：如果一次无法写完，请在自然的场景断点停下，并在下一次继续时从上一句无缝续写，不要重述前文、不要重新开始。');
      }
    }else if(L.strict || L.segmented){
      if(L.strict) lines.push('请把内容写足，不要用总结或时间跳跃压缩剧情，也不要提前收尾。');
      if(L.segmented) lines.push('如果一次写不完，请在自然的场景断点停下，下次从上一句无缝续写。');
    }
    if(L.countOutput){
      lines.push('正文全部写完之后，另起一行单独输出：');
      lines.push('【输出总字数：XXXX字】');
      lines.push('这个数字必须基于实际已经输出的正文统计，不要预测、估算或虚报。');
    }
    if(!lines.length) return '';
    return block('篇幅要求', lines);
  }
  function buildOutput(s){
    return block('输出要求', [
      '直接开始写番外正文。',
      '不要在开头解释"根据你的要求"，不要复述上面的设定，不要输出创作分析或剧情大纲。',
      '不要先分析这段 Prompt，也不要说明自己将要怎么写。',
      '不要把上面的要求逐项打卡或分点回应。',
      '重点是写出一个自然、连贯、有情绪推进的独立番外。'
    ]);
  }
  function buildFinal(s){
    const lines = [
      '写作过程中请自己确认：没有把番外写成主线；没有修改原剧情；没有擅自改变人物；没有强行让 CHAR 与 USER 产生恋爱关系；没有依据性别、职业或身份套用刻板印象；没有把标签机械打卡；没有过度解释情绪；没有快速跳过剧情；没有用总结凑篇幅；没有虚报字数；没有在正文前输出大量分析；没有把没提供的信息写成固定事实。'
    ];
    const refuse = nonEmpty(s.refuse);
    if(refuse.length){
      lines.push('以下内容绝对不要出现：');
      refuse.forEach(r => lines.push('· ' + r));
    }
    return block('最后确认', lines);
  }
  function buildOpening(s){
    const lines = [trim(s.opening)];
    if(s.openingExtraOn && trim(s.openingExtra)) lines.push(trim(s.openingExtra));
    return lines.filter(Boolean).join('\n');
  }
  function buildCustomPrompts(s){
    const ids = s.customPromptIds || [];
    const list = Store.prompts.filter(p => ids.indexOf(p.id) >= 0 && p.enabled !== false);
    if(!list.length) return '';
    return list.map(p => trim(p.content)).filter(Boolean).join('\n\n');
  }

  /* ---------- 自然段落形态 ----------
     把同样的信息写成连贯的话，而不是【】分区 + 逐条罗列。
     重心是「这一篇具体要什么」，元指令压到最少。 */
  function joinSentences(list, sep){
    const out = (list || []).map(trim).filter(Boolean);
    if(!out.length) return '';
    return out.join(sep || '；') + '。';
  }
  function proseIdea(s){
    const raw = trim(s.brainDump);
    return raw;                      // 用户自己写的东西，原样放在最前面
  }
  /* 返回 {text, rich}：rich 表示除了名字之外还写了别的，只有名字时不值得加那句「没写到的保持未知」 */
  function personProse(s, label, p){
    const bits = [];
    const nm = val(p.name);
    const who = nm ? nm + '（' + label + '）' : label;
    const id = [orCustom(p.identity, p.identityCustom), val(p.job)].filter(Boolean).join('、');
    const base = [];
    if(val(p.gender)) base.push(val(p.gender) + '性');
    if(orCustom(p.age, p.ageCustom)) base.push(orCustom(p.age, p.ageCustom));
    if(id) base.push(id);
    if(base.length) bits.push(who + '是' + base.join('、'));
    const per = nonEmpty(p.personality);
    const tem = val(p.temperament);
    if(per.length || tem) bits.push((bits.length ? '' : who) + '性格' + [per.join('、'), tem].filter(Boolean).join('、'));
    if(val(p.social)) bits.push((bits.length ? '' : who) + '的社会位置是' + val(p.social));
    if(val(p.orientation)) bits.push((bits.length ? '' : who) + '性取向' + val(p.orientation) + '，不要中途改变');
    if(val(p.extra)) bits.push(val(p.extra));
    if(bits.length) return {text: bits.join('，'), rich: true};
    return nm ? {text: label + ' 是' + nm, rich: false} : {text: '', rich: false};
  }
  function proseCharacters(s){
    const c = s.characters, lines = [];
    if(c.mode === 'group') lines.push('这是一篇群像，多个角色一起承担剧情，不要把重心压到某一对关系上');
    else if(c.mode === 'multi') lines.push('出场角色不止两个，每个人都要有自己的目的和反应');
    const a = personProse(s, 'CHAR', c.char), b = personProse(s, 'USER', c.user);
    let rich = a.rich || b.rich;
    if(a.text) lines.push(a.text);
    if(b.text) lines.push(b.text);
    (c.others || []).forEach(o => {
      const bits = [];
      if(val(o.identity) || val(o.job)) bits.push([val(o.identity), val(o.job)].filter(Boolean).join('、'));
      if(val(o.personality)) bits.push(val(o.personality));
      if(val(o.relation)) bits.push(val(o.relation));
      if(val(o.extra)) bits.push(val(o.extra));
      if(val(o.name)){ lines.push(val(o.name) + (bits.length ? '：' + bits.join('，') : ' 也会出场')); rich = rich || bits.length > 0; }
    });
    const names = personNameMap(s);
    (c.relations || []).filter(r => trim(r.desc)).forEach(r => {
      const f = names[r.from] || r.from, t = names[r.to] || r.to;
      if(f && t) lines.push(f + '对' + t + '：' + trim(r.desc));
    });
    if(!lines.length) return '';
    if(rich) lines.push('没写到的部分保持未知，不要根据性别、身份或职业替角色补性格和能力');
    return joinSentences(lines);
  }
  function proseWorld(s){
    const w = s.world, lines = [];
    const era = orCustom(w.era, w.eraCustom), wt = orCustom(w.type, w.typeCustom);
    if(era || wt) lines.push('背景设定在' + [era, wt].filter(Boolean).join('的'));
    const so = orCustom(w.social, w.socialCustom);
    if(so) lines.push('两人之间存在' + so + '这样的身份差距');
    if(val(w.charIdentity)) lines.push('CHAR 的身份是' + val(w.charIdentity));
    if(val(w.userIdentity)) lines.push('USER 的身份是' + val(w.userIdentity));
    const sc = uniq(nonEmpty(w.scenes).concat(splitList(w.sceneCustom)));
    if(sc.length) lines.push('场景可以放在' + sc.join('、'));
    const lit = nonEmpty(w.literary);
    if(lit.length) lines.push('气质上参考' + lit.join('、') + '那种时代感、人物张力与叙事节奏，但不要复制原作的剧情和人物');
    const scr = nonEmpty(w.screen);
    if(scr.length) lines.push('节奏和画面参考' + scr.join('、') + '的感觉');
    if(val(w.screenFeel)) lines.push('整体想要的感觉是' + val(w.screenFeel));
    return joinSentences(lines);
  }
  function proseRelationship(s){
    const r = s.relationship, lines = [];
    const cur = orCustom(r.current, r.currentCustom);
    if(cur) lines.push('两人现在的关系是' + cur + '，番外从这个状态开始');
    const defs = Store.get('sliderDefs', DEFAULT_SLIDERS);
    defs.forEach(d => {
      const cfg = (r.sliders || {})[d.key];
      if(!cfg || !cfg.on) return;
      const v = typeof cfg.value === 'number' ? cfg.value : d.value;
      if(d.key === 'initiative'){
        const who = v < 35 ? nameA(s) : (v > 65 ? nameB(s) : null);
        lines.push(who ? ('关系里的主动权更多在' + who + '一侧') : '两人的主动权大致均衡');
        return;
      }
      const t = SLIDER_TEXT[d.key];
      if(t) lines.push(t[band(v)].replace(/。$/, ''));
      else lines.push('「' + d.name + '」偏向「' + (v > 50 ? d.max : d.min) + '」');
    });
    ROLE_QUESTIONS.forEach(q => {
      const n = roleName(s, (r.roles || {})[q.key]);
      if(n) lines.push(q.label + '是' + n);
    });
    return joinSentences(lines);
  }
  function proseTags(s){
    const {translated, plain} = translateTags(s);
    if(!translated.length && !plain.length) return '';
    const chunks = [];
    for(let i = 0; i < translated.length; i += 3){
      chunks.push(joinSentences(translated.slice(i, i+3).map(t => t.text)));
    }
    if(plain.length) chunks.push('另外让这些方向自然存在于故事里：' + plain.join('、') + '。');
    const head = translated.length ? '这一篇要抓住的感觉：' : '';
    return (head ? head + '\n' : '') + chunks.join('\n');
  }
  function proseNarrative(s){
    const n = s.narrative, lines = [];
    const defs = Store.get('narrativeDefs', DEFAULT_NARRATIVE_SLIDERS);
    defs.forEach(d => {
      const cfg = (n.sliders || {})[d.key];
      if(!cfg || !cfg.on) return;
      const v = typeof cfg.value === 'number' ? cfg.value : d.value;
      const t = NARRATIVE_TEXT[d.key];
      if(t) lines.push(t[band(v)].replace(/。$/, ''));
    });
    const pov = orCustom(n.pov, n.povCustom);
    if(pov) lines.push('用' + pov + '来写');
    const st = nonEmpty(n.styles);
    if(st.length) lines.push('风格偏' + st.join('、'));
    const ig = orCustom(n.infoGap, n.infoGapCustom);
    if(ig && ig !== '没有明显信息差') lines.push('信息差是' + ig + '，让它影响人物的判断和对话，不要靠旁白解释');
    const moods = uniq(nonEmpty(s.vibe.moods).concat(splitList(s.vibe.custom)));
    if(moods.length) lines.push('整体氛围偏' + moods.join('、'));
    const v = s.visual, vb = [];
    if(val(v.season)) vb.push(val(v.season));
    if(val(v.time)) vb.push(val(v.time));
    if(val(v.weather)) vb.push(val(v.weather));
    if(val(v.tone)) vb.push(val(v.tone) + '的色调');
    if(val(v.custom)) vb.push(val(v.custom));
    if(vb.length) lines.push('画面基调是' + vb.join('、'));
    const e = orCustom(s.ending, s.endingCustom);
    if(e) lines.push('结局倾向' + e + '，但要由剧情自然导向，不要为了收尾硬转');
    const x = s.extra;
    if(x && x.on){
      const hooks = uniq(nonEmpty(x.hooks).concat(splitList(x.custom)));
      const lv = x.level || '轻';
      lines.push('可以加一点' + (hooks.length ? hooks.join('、') : '不破坏走向的小意外') +
        (lv === '轻' ? '，幅度小一点，只当点缀' : lv === '中' ? '，可以形成一个小转折' : '，可以大胆一些'));
    }
    return joinSentences(lines);
  }
  function proseLength(s){
    const L = s.length || {};
    const target = trim(L.custom) || (L.target && L.target !== '不限' ? L.target : '');
    const lines = [];
    if(target){
      let main = '请以此展开写一篇番外，不少于' + target + '字';
      if(L.strict) main += '，把这个字数当成最低线，不到不要收尾，不要用总结或跳时间压缩剧情，也不要虚报字数';
      lines.push(main);
    }else if(L.strict){
      lines.push('内容要写足，不要用总结或跳时间压缩剧情，也不要提前收尾');
    }
    if(L.segmented) lines.push('一次写不完就停在自然的场景断点，下次从上一句无缝接着写');
    if(L.countOutput) lines.push('正文写完后另起一行输出【输出总字数：XXXX字】，数字要按实际写出的正文统计，不要估算或虚报');
    return joinSentences(lines);
  }
  function proseRules(s){
    const lines = ['这段番外不计入主线，不要修改主线的事件、人物记忆和关系状态',
                   '保持角色原本的人格、说话方式和行为逻辑，不要为了剧情让人 OOC',
                   '没明确给的信息不要写成固定事实'];
    if(nonEmpty(s.refuse).length) lines.push('另外这些绝对不要出现：' + nonEmpty(s.refuse).join('、'));
    return joinSentences(lines);
  }
  function proseOutput(s){
    return joinSentences(['直接开始正文，不要复述以上要求，不要写分析或大纲，也不要逐条打卡']);
  }
  function proseParts(s){
    return {
      CUSTOM_PROMPTS: buildCustomPrompts(s),
      OPENING_COMMAND: buildOpening(s),
      RULES: proseRules(s),
      USER_IDEA: proseIdea(s),
      CHARACTERS: proseCharacters(s),
      WORLD: proseWorld(s),
      RELATIONSHIP: proseRelationship(s),
      TAGS: proseTags(s),
      NARRATIVE: proseNarrative(s),
      VIBE: '', VISUAL: '', ENDING: '', EXTRA: '',    // 自然模式里这些已经并进 NARRATIVE
      LENGTH: proseLength(s),
      OUTPUT: proseOutput(s),
      FINAL: '',                                      // 自查清单在自然模式里不输出
      REFUSE: '',
      TITLE: trim(s.title)
    };
  }

  /* ---------- 组装 ---------- */
  function parts(s){
    const level = s.compileLevel || 'polish';
    return {
      CUSTOM_PROMPTS: buildCustomPrompts(s),
      OPENING_COMMAND: buildOpening(s),
      RULES: buildRules(s),
      USER_IDEA: buildIdea(s, level),
      CHARACTERS: buildCharacters(s),
      WORLD: buildWorld(s),
      RELATIONSHIP: buildRelationship(s),
      TAGS: buildTags(s, level),
      NARRATIVE: buildNarrative(s),
      VIBE: buildVibe(s),
      VISUAL: buildVisual(s),
      ENDING: buildEnding(s),
      EXTRA: buildExtra(s, level),
      LENGTH: buildLength(s),
      OUTPUT: buildOutput(s),
      FINAL: buildFinal(s),
      REFUSE: '',
      TITLE: trim(s.title)
    };
  }
  const MODULE_PARTS = {
    customPrompts:['CUSTOM_PROMPTS'], opening:['OPENING_COMMAND'], rules:['RULES'], idea:['USER_IDEA'],
    characters:['CHARACTERS'], world:['WORLD'], relationship:['RELATIONSHIP'], tags:['TAGS'],
    narrative:['NARRATIVE','VIBE','VISUAL','ENDING','EXTRA'], length:['LENGTH'], output:['OUTPUT'], final:['FINAL']
  };
  function assembleModules(s, P, natural){
    const mods = Store.get('modules', DEFAULT_MODULES);
    const out = [];
    mods.forEach(m => {
      if(m.enabled === false) return;
      if(m.custom){ if(trim(m.text)) out.push(trim(m.text)); return; }
      (MODULE_PARTS[m.key] || []).forEach(k => { if(trim(P[k])) out.push(trim(P[k])); });
    });
    /* 自然模式里各段是连着读的话，不要空行把它割成一块块 */
    return out.join(natural ? '\n' : '\n\n');
  }
  function fillVars(text, P){
    return String(text || '').replace(/\{\{(\w+)\}\}/g, (m, key) => (P[key] !== undefined ? P[key] : ''));
  }
  /* 模板有两种：
     wrap —— 你自己的固定开头 + 本次番外的具体内容 + 你自己的固定结尾（常用）
     advanced —— 直接用变量自己排布整篇（想换模块位置时才需要）
     老模板没有 mode 字段：body 被改过就当 advanced，否则当 wrap。 */
  function templateMode(tpl){
    if(!tpl) return 'wrap';
    if(tpl.mode) return tpl.mode;
    const b = trim(tpl.body);
    return (b && b !== '{{MODULES}}') ? 'advanced' : 'wrap';
  }
  function render(s){
    const natural = (s.promptStyle || 'natural') !== 'structured';
    const P = natural ? proseParts(s) : parts(s);
    P.MODULES = assembleModules(s, P, natural);
    const tpl = Store.template(s.promptTemplateId);
    let out;
    if(templateMode(tpl) === 'advanced'){
      out = fillVars(trim(tpl.body) || '{{MODULES}}', P);
    }else{
      out = [fillVars(tpl && tpl.head, P), P.MODULES, fillVars(tpl && tpl.tail, P)]
        .map(trim).filter(Boolean).join(natural ? '\n' : '\n\n');
    }
    return out.replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n').trim();
  }

  /* ---------- AI 理解 / 番外方向（本地生成） ---------- */
  function understanding(s){
    const {translated, plain, tags} = translateTags(s);
    const L = [];
    const raw = trim(s.brainDump);
    L.push(raw ? '你想看的是：' + raw.replace(/\s+/g,' ').slice(0, 300) + (raw.length > 300 ? '…' : '') : '你没有写具体脑洞，这次以标签与设定为主要方向。');
    if(tags.length) L.push('抓到的嗑点：' + tags.join('、') + '。');
    if(translated.length){
      L.push('其中这些被翻译成了可执行的行为要求，而不是直接丢给模型：');
      translated.slice(0, 8).forEach(t => L.push('· ' + t.tag + ' → ' + t.text));
      if(translated.length > 8) L.push('· …其余 ' + (translated.length - 8) + ' 条同样已翻译。');
    }
    if(plain.length) L.push('这些标签没有词典条目，会作为整体方向交给模型：' + plain.join('、') + '。你可以到「语义词典」里给它们补一条翻译。');
    const open = [];
    if(s.characters.mode === 'unspecified') open.push('人物（沿用当前上下文）');
    if(val(s.world.era) === '' && val(s.world.type) === '') open.push('世界观');
    if(val(s.ending) === '') open.push('结局');
    if(open.length) L.push('这些你没有指定，Prompt 里不会写死，保持开放：' + open.join('、') + '。');
    return L.join('\n');
  }
  function direction(s){
    const {translated, plain} = translateTags(s);
    const L = [];
    const cur = orCustom(s.relationship.current, s.relationship.currentCustom);
    const modeText = {unspecified:'', single:'单角色', dual:'双角色', multi:'多角色', group:'群像'}[s.characters.mode] || '';
    const start = [];
    if(modeText) start.push(modeText);
    if(cur) start.push('从「' + cur + '」的关系状态出发');
    const scenes = nonEmpty(s.world.scenes).concat(splitList(s.world.sceneCustom));
    if(scenes.length) start.push('场景落在' + scenes.slice(0,3).join('、'));
    if(start.length) L.push('起点：' + start.join('，') + '。');
    const push = [];
    const sl = s.relationship.sliders || {};
    if(sl.jealous && sl.jealous.on) push.push('用吃醋与情绪波动作为推进点');
    if(sl.ambiguous && sl.ambiguous.on && sl.ambiguous.value > 50) push.push('把暧昧维持在不点破的状态');
    if(sl.power && sl.power.on && sl.power.value > 50) push.push('让权力位置影响每一次选择');
    if(sl.change && sl.change.on && sl.change.value > 60) push.push('让关系在结尾发生位移');
    const keyTags = translated.map(t => t.tag).concat(plain);
    if(!push.length && keyTags.length) push.push('围绕「' + keyTags.slice(0,3).join('、') + '」推进');
    if(push.length) L.push('推进方式：' + push.join('；') + '。');
    const end = orCustom(s.ending, s.endingCustom);
    const moods = nonEmpty(s.vibe.moods);
    const tail = [];
    if(moods.length) tail.push('整体落在' + moods.join('、') + '的氛围里');
    if(end) tail.push('结局倾向「' + end + '」');
    if(tail.length) L.push('落点：' + tail.join('，') + '。');
    const L2 = trim(s.length.custom) || (s.length.target !== '不限' ? s.length.target : '');
    if(L2) L.push('篇幅：目标 ' + L2 + ' 字' + (s.length.strict ? '（严格模式：不到目标不收尾）' : '') + '。');
    if(!L.length) return '目前信息很少，最终 Prompt 会保持开放，把发挥空间交给目标模型。';
    return L.join('\n');
  }

  /* ---------- 冲突 / 推荐 ---------- */
  function conflicts(s){
    const tags = storyTagList(s);
    const rel = [orCustom(s.relationship.current, s.relationship.currentCustom)].filter(Boolean);
    const all = tags.concat(rel).concat(nonEmpty(s.narrative.styles)).concat(nonEmpty(s.vibe.moods));
    const out = [];
    CONFLICT_PAIRS.forEach(p => {
      if(all.indexOf(p[0]) >= 0 && all.indexOf(p[1]) >= 0) out.push(p);
    });
    return out;
  }
  function related(s){
    const tags = storyTagList(s);
    const pool = [];
    tags.forEach(t => (RELATED_TAGS[t] || []).forEach(r => { if(tags.indexOf(r) < 0) pool.push(r); }));
    const known = new Set(Store.allTags().map(x => x.tag));
    return uniq(pool).filter(t => known.has(t)).slice(0, 8);
  }

  return {render, parts, understanding, direction, conflicts, related, translateTags, block, assembleModules, templateMode};
})();

/* ---------- 字数统计 ---------- */
function countText(text){
  const t = String(text || '');
  const chars = Array.from(t).length;
  const noSpace = Array.from(t.replace(/\s/g,'')).length;
  const cn = (t.match(/[一-鿿㐀-䶿]/g) || []).length;
  const en = (t.match(/[A-Za-z]+/g) || []).length;
  return {chars, noSpace, cn, en, paragraphs: t.split(/\n\s*\n/).filter(x => trim(x)).length};
}

/* ============================================================
   5. API 客户端（OpenAI 兼容，浏览器直连；仅在用户开启时调用）
   ============================================================ */
const Api = {
  endpoint(cfg){
    let b = trim(cfg.baseUrl).replace(/\s/g,'');
    if(!b) return '';
    b = b.replace(/\/+$/,'');
    if(/\/chat\/completions$/.test(b)) return b;
    if(/\/v\d+$/.test(b)) return b + '/chat/completions';
    return b + '/v1/chat/completions';
  },
  friendlyError(status, body){
    const map = {
      400:'请求格式有问题，请检查模型名称与自定义参数。',
      401:'API Key 无效或已过期，请到「API 设置」重新填写。',
      403:'这个 Key 没有访问该模型的权限。',
      404:'找不到接口地址或模型，请检查 Base URL 与 Model 是否正确。',
      408:'请求超时，稍后再试一次。',
      413:'内容太长，超出模型可接受的长度。',
      429:'请求太频繁或额度用尽，请稍后再试。',
      500:'服务端出错了，请稍后再试。',
      502:'网关错误，服务暂时不可用。',
      503:'服务暂时不可用，请稍后再试。'
    };
    let extra = '';
    try{
      const j = typeof body === 'string' ? JSON.parse(body) : body;
      const m = j && (j.error && (j.error.message || j.error.code) || j.message);
      if(m) extra = '（' + String(m).slice(0, 160) + '）';
    }catch(e){ if(typeof body === 'string' && body && body.length < 160) extra = '（' + body + '）'; }
    return (map[status] || ('请求失败，状态码 ' + status + '。')) + extra;
  },
  modelsEndpoint(cfg){
    let b = trim(cfg.baseUrl).replace(/\s/g,'').replace(/\/+$/,'');
    if(!b) return '';
    b = b.replace(/\/chat\/completions$/, '');
    if(/\/models$/.test(b)) return b;
    if(/\/v\d+$/.test(b)) return b + '/models';
    return b + '/v1/models';
  },
  /* 拉取可用模型列表。兼容 OpenAI 的 {data:[{id}]}、Gemini 的 {models:[{name}]}，
     以及直接返回数组的服务。 */
  async models(cfg){
    const url = this.modelsEndpoint(cfg || {});
    if(!url) throw new Error('先填 Base URL，才知道去哪里拉模型。');
    const headers = {};
    if(trim(cfg.apiKey)) headers['Authorization'] = 'Bearer ' + trim(cfg.apiKey);
    let res;
    try{
      res = await fetch(url, {method:'GET', headers: headers});
    }catch(e){
      throw new Error('连不上接口地址，请检查网络、Base URL，或该服务是否允许浏览器直接调用（CORS）。');
    }
    const text = await res.text();
    if(!res.ok) throw new Error(this.friendlyError(res.status, text));
    let data;
    try{ data = JSON.parse(text); }catch(e){ throw new Error('接口返回的不是有效的 JSON，无法解析模型列表。'); }
    const arr = Array.isArray(data) ? data : (data.data || data.models || data.result || []);
    if(!Array.isArray(arr)) throw new Error('没在返回里找到模型列表（既没有 data 也没有 models）。');
    const ids = arr
      .map(x => (typeof x === 'string') ? x : (x && (x.id || x.name || x.model)))
      .filter(Boolean)
      .map(id => String(id).replace(/^models\//, ''));
    if(!ids.length) throw new Error('接口没有返回任何模型。');
    return uniq(ids).sort();
  },
  async chat(messages, cfgIn, overrides){
    const cfg = cfgIn || Store.activeApi();
    if(!cfg) throw new Error('还没有配置 API。可以到「API 设置」添加一个，或者继续使用本地编译。');
    const url = this.endpoint(cfg);
    if(!url) throw new Error('Base URL 是空的，请到「API 设置」补上。');
    if(!trim(cfg.model)) throw new Error('还没有填写模型名称（Model）。');
    const payload = Object.assign({
      model: trim(cfg.model),
      messages: messages,
      temperature: typeof cfg.temperature === 'number' ? cfg.temperature : 0.7,
      max_tokens: cfg.maxTokens ? Number(cfg.maxTokens) : 4096,
      stream: false
    }, parseCustomParams(cfg.customParams), overrides || {});
    const headers = {'Content-Type':'application/json'};
    if(trim(cfg.apiKey)) headers['Authorization'] = 'Bearer ' + trim(cfg.apiKey);
    let res;
    try{
      res = await fetch(url, {method:'POST', headers: headers, body: JSON.stringify(payload)});
    }catch(e){
      throw new Error('连不上接口地址，请检查网络、Base URL，或该服务是否允许浏览器直接调用（CORS）。');
    }
    const text = await res.text();
    if(!res.ok) throw new Error(this.friendlyError(res.status, text));
    let data;
    try{ data = JSON.parse(text); }catch(e){ throw new Error('接口返回的不是有效的 JSON，无法解析。'); }
    const c = data.choices && data.choices[0];
    const content = c && (c.message && c.message.content || c.text);
    if(!content) throw new Error('接口没有返回内容，可能是模型名称不对或额度不足。');
    return String(content);
  }
};
function parseCustomParams(str){
  if(!trim(str)) return {};
  try{
    const o = JSON.parse(str);
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
  }catch(e){ return {}; }
}

async function generateStoryline(story){
  const {translated, plain} = Compiler.translateTags(story);
  const info = {
    梗与感觉: translated.map(t => t.tag + '（' + t.text + '）').concat(plain),
    人物: trim(Compiler.parts(story).CHARACTERS) || '(未指定，可以只用 CHAR 和 USER 指代)',
    世界与场景: trim(Compiler.parts(story).WORLD) || '(未指定)',
    关系: trim(Compiler.parts(story).RELATIONSHIP) || '(未指定)',
    氛围与结局倾向: [trim(Compiler.parts(story).VIBE), trim(Compiler.parts(story).ENDING)].filter(Boolean).join(' ') || '(未指定)'
  };
  const existing = trim(story.brainDump);
  const user = [
    existing
      ? '用户已经写了这些，请在完全保留它的核心意图的前提下，把它补成一条更完整、更具体的主线：\n' + existing
      : '用户没有写脑洞，请只根据下面这些梗，编一条具体的主线。',
    '',
    '可用的材料：',
    JSON.stringify(info, null, 1),
    '',
    '再强调一次：只输出那段剧情设定本身，不要任何指令性语句。'
  ].join('\n');
  const raw = await Api.chat([
    {role:'system', content: aiPrompt('storyline')},
    {role:'user', content: user}
  ], null, {temperature: 0.95});
  return trim(String(raw)).replace(/^["「『]|["」』]$/g, '');
}

/* AI 批量生成标签：产出短标签 + 行为语言翻译，两边一起进标签池和语义词典 */
async function generateTags(catName, theme, count){
  const existing = Store.allTags().map(x => x.tag);
  const user = [
    '分类：' + catName,
    theme ? ('方向 / 主题：' + theme) : '方向：贴着这个分类本身的意思来',
    '数量：' + count + ' 个',
    '',
    '已经有的标签（不要重复，也不要只改一两个字的近义词）：',
    existing.join('、') || '（暂时没有）'
  ].join('\n');
  const raw = await Api.chat([
    {role:'system', content: aiPrompt('taggen')},
    {role:'user', content: user}
  ], null, {temperature: 0.95});
  const data = extractJsonLoose(raw);
  const arr = Array.isArray(data) ? data : (data && (data.tags || data.data));
  if(!Array.isArray(arr) || !arr.length) throw new Error('模型没有按要求返回标签列表，可以到「AI 指令」里把要求写得更明确。');
  const seen = new Set();
  return arr.map(x => {
    if(typeof x === 'string') return {tag: trim(x), meaning: ''};
    return {tag: trim(x && (x.tag || x.name)), meaning: trim(x && (x.meaning || x.desc || x.text))};
  }).filter(x => {
    if(!x.tag || x.tag.length > 20 || seen.has(x.tag)) return false;
    seen.add(x.tag); return true;
  });
}

    });
    if(!r) return;
    if(r.act === 'again'){
      toast('再生成一批…');
      try{ list = await generateTags(cat.name, setup.theme, setup.count); }
      catch(e){ toast(String(e.message || e), 4600); return; }
      continue;
    }
    const picked = r.picked || [];
    if(!picked.length){ toast('一个都没选'); return; }
    let nTag = 0, nLex = 0;
    for(const x of picked){
      if(cat.tags.indexOf(x.tag) < 0){ cat.tags.push(x.tag); nTag++; }
      if(setup.lex && x.meaning){
        const exist = Store.lexicon.find(l => l.tag === x.tag);
        if(exist){ exist.meaning = x.meaning; exist.updatedAt = now(); await DB.put('lexicon', exist); }
        else{
          const l = {id:uid(), tag:x.tag, meaning:x.meaning, builtin:false, order:Store.lexicon.length, createdAt:now()};
          Store.lexicon.push(l); await DB.put('lexicon', l);
        }
        nLex++;
      }
    }
    await DB.put('tagpool', cat);
    toast('加了 ' + nTag + ' 个标签' + (nLex ? '，' + nLex + ' 条翻译' : ''));
    if(Router.current === '/tags') renderTagPool();
    else if(Cur) renderEditor();
    return;
  }
}

async function aiCompile(story){
  const basePrompt = Compiler.render(story);
  const payload = {
    标题: trim(story.title) || '(未填写)',
    用户脑洞: trim(story.brainDump) || '(未填写)',
    选中标签: storyTagList(story),
    标签的行为语言翻译: Compiler.translateTags(story).translated.map(t => t.tag + ' → ' + t.text),
    本地已编译的Prompt: basePrompt
  };
  const user = [
    aiPrompt('level_' + (story.compileLevel || 'polish')),
    trim(story.brainDump)
      ? ''
      : '\n用户这次没有写脑洞，只给了标签。请先根据这些标签编出一条具体的主线（谁、什么处境、发生了什么、转折和落点），把它写成一段连贯的话放在 Prompt 的主体位置，而不是把标签罗列出来。',
    '',
    '以下是结构化输入，请据此产出 JSON：',
    JSON.stringify(payload, null, 1),
    '',
    '注意：「本地已编译的Prompt」已经包含全部必要模块与限制条款，你的工作是在保留其结构与全部限制的前提下，让语言更自然、更连贯、更可执行。不要删除任何限制条款，不要加入你自己的写作示范。'
  ].join('\n');
  const raw = await Api.chat([
    {role:'system', content: aiPrompt('compile')},
    {role:'user', content: user}
  ]);
  const parsed = extractJson(raw);
  if(!parsed || !trim(parsed.prompt)) throw new Error('模型没有按要求返回可用结果，已保留本地编译版本。');
  return {
    title: trim(parsed.title),
    understanding: trim(parsed.understanding) || Compiler.understanding(story),
    direction: trim(parsed.direction) || Compiler.direction(story),
    prompt: trim(parsed.prompt)
  };
}
function extractJsonLoose(text){
  const t = String(text || '').replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  try{ return JSON.parse(t); }catch(e){}
  const pairs = [['[',']'], ['{','}']];
  for(const [a, b] of pairs){
    const i = t.indexOf(a), j = t.lastIndexOf(b);
    if(i >= 0 && j > i){ try{ return JSON.parse(t.slice(i, j + 1)); }catch(e){} }
  }
  return null;
}
function extractJson(text){
  const t = String(text || '').replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  try{ return JSON.parse(t); }catch(e){}
  const i = t.indexOf('{'), j = t.lastIndexOf('}');
  if(i >= 0 && j > i){
    try{ return JSON.parse(t.slice(i, j+1)); }catch(e){}
  }
  return null;
}

const Router = {
  routes: {},
  current: '',
  add(path, fn){ this.routes[path] = fn; return this; },
  parse(){
    const h = location.hash.replace(/^#/, '') || '/';
    const seg = h.split('/').filter(Boolean);
    return {path: '/' + (seg[0] || ''), arg: seg[1] ? decodeURIComponent(seg[1]) : '', arg2: seg[2] ? decodeURIComponent(seg[2]) : ''};
  },
  async go(){
    const r = this.parse();
    this.current = r.path;
    const fn = this.routes[r.path] || this.routes['/'];
    $('#actionbar-slot').innerHTML = '';
    window.scrollTo(0, 0);
    $$('.dlink').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + r.path));
    $('#btn-back').classList.toggle('hidden', r.path === '/');   // 首页没地方可返回
    closeDrawer();
    try{

      console.error(e);
      $('#view').innerHTML = '<div class="card"><div class="note warn">页面出错了：' + esc(e && e.message || e) + '</div></div>';

function moveItem(arr, idx, dir){
  const j = idx + dir;
  if(j < 0 || j >= arr.length) return arr;

function restoreFolds(){
  $$('[data-fold]').forEach(d => { if(OpenFolds.has(d.dataset.fold)) d.open = true; });
  $$('[data-fold]').forEach(d => {
    if(d._foldBound) return;
    d._foldBound = true;
    d.addEventListener('toggle', () => {
      if(d.open) OpenFolds.add(d.dataset.fold); else OpenFolds.delete(d.dataset.fold);
    });
  });
}
function refreshTags(){
  const node = $('#sec-tags');
  if(node){ node.outerHTML = secTags(); restoreFolds(); }
}
function refreshPreview(){
  const node = $('#sec-preview');
  if(node) node.outerHTML = secPreview();
}

function onSlider(e){
  const row = e.target.closest('.slider-row');
  if(!row || !Cur) return;
  const group = row.dataset.group, key = row.dataset.slider;
  const target = group === 'relationship' ? Cur.relationship : Cur.narrative;

document.addEventListener('click', async (e) => {
  const zone = e.target.closest('#view, .actionbar');
  if(!zone) return;
  const chip = e.target.closest('.chip');
  const act = e.target.closest('[data-act]');
  /* 标签类 chip */
  if(chip && !act){
    if(chip.dataset.tagcat && Cur){ toggleTag(Cur, chip.dataset.tagcat, chip.dataset.tag); autosave(); refreshTags(); return; }
    if(chip.dataset.multi && Cur){
      const p = chip.dataset.multi, arr = getPath(Cur, p) || [];
      const i = arr.indexOf(chip.dataset.tag);
      if(i >= 0) arr.splice(i,1); else arr.push(chip.dataset.tag);
      setPath(Cur, p, arr); chip.classList.toggle('on'); autosave(); return;
    }
    if(chip.dataset.single && Cur){
      setPath(Cur, chip.dataset.single, chip.dataset.tag);
      $$('.chip[data-single="' + chip.dataset.single + '"]').forEach(c => c.classList.toggle('on', c === chip));
      autosave(); return;
    }
  }
  if(!act) return;
  const a = act.dataset.act;
  const handler = EditorActions[a] || GlobalActions[a];
  if(handler){ e.preventDefault(); e.stopPropagation(); await handler(act, e); }
});

/* ---------- 编译 ---------- */
function autoTitle(s){
  const raw = trim(s.brainDump).replace(/\s+/g,' ');
  if(raw) return raw.slice(0, 12) + (raw.length > 12 ? '…' : '');
  const t = storyTagList(s);
  if(t.length) return t.slice(0, 3).join('·');
  return '未命名番外';
}
async function doCompile(useAi){
  const s = Cur;
  const conf = Compiler.conflicts(s);
  if(conf.length){
    const go = await openModal({
      title:'有几组标签方向相反',
      bodyHTML:'<div class="conflict">' + conf.map(p => '「' + esc(p[0]) + '」 vs 「' + esc(p[1]) + '」').join('<br>') + '</div>' +
        '<div class="note">工具不会替你取舍，也不会让模型各写一半。要继续就直接编译，要调整就先回去改标签。</div>',
      actions:[{label:'回去改', value:false},{label:'就这样编译', value:true, primary:true}]
    });
    if(!go) return;
  }
  let result = {
    understanding: Compiler.understanding(s),
    direction: Compiler.direction(s),
    prompt: Compiler.render(s),
    source: 'local'
  };
  if(useAi){
    const btn = $('.actionbar .primary');
    if(btn){ btn.disabled = true; btn.innerHTML = '正在调用 AI 整理…'; }
    try{
      const r = await aiCompile(s);
      result = {understanding:r.understanding, direction:r.direction, prompt:r.prompt, source:'ai'};
      if(!trim(s.title) && r.title) s.title = r.title;
      toast('AI 整理完成');
    }catch(err){
      toast(String(err.message || err), 3800);
    }
    if(btn){ btn.disabled = false; btn.innerHTML = icon('refresh','sm') + '生成 Prompt'; }
  }
  if(!trim(s.title)) s.title = autoTitle(s);
  s.promptVersions.push({
    v: s.promptVersions.length + 1, createdAt: now(),
    understanding: result.understanding, direction: result.direction,
    prompt: result.prompt, source: result.source, note:''
  });
  s.currentPromptVersion = s.promptVersions.length;
  await Store.saveStory(s);
  renderEditor();
  toast('已生成 v' + s.currentPromptVersion);
}
function currentPromptText(){
  const v = Cur.promptVersions[Cur.currentPromptVersion - 1];
  return v ? v.prompt : Compiler.render(Cur);
}

/* ---------- 随机抽取 ---------- */
function drawTags(o){
  let pool = Store.allTags().filter(x => o.cats.indexOf(x.cat) >= 0).map(x => x.tag);
  pool = uniq(pool).filter(t => (o.exclude || []).indexOf(t) < 0);
  if(o.avoid && o.avoid.length) pool = pool.filter(t => !o.avoid.some(a => t.indexOf(a) >= 0));
  let out = [];
  if(o.want && o.want.length){
    const hit = pool.filter(t => o.want.some(w => t.indexOf(w) >= 0));
    out = shuffle(hit).slice(0, o.count);
  }
  const rest = shuffle(pool.filter(t => out.indexOf(t) < 0));
  out = out.concat(rest.slice(0, Math.max(0, o.count - out.length)));
  return out;
}
async function randomDrawFlow(){
  const cats = Store.tagCats;
  const setup = await openModal({
    title:'随机抽取',
    bodyHTML:
      '<div class="field"><label class="lb">抽几个</label><input class="input" type="number" min="1" max="30" value="5" id="rd-count" data-autofocus></div>' +
      '<div class="field"><label class="lb">从哪些分类里抽</label><div class="chips" id="rd-cats">' +
        cats.map(c => '<span class="chip on" data-cat="' + attr(c.key) + '">' + esc(c.name) + '</span>').join('') + '</div></div>' +
      '<div class="field"><label class="lb">想要<span class="hint">关键词，逗号分隔，可留空</span></label><input class="input" id="rd-want" placeholder="例如：吃醋,重逢"></div>' +
      '<div class="field"><label class="lb">不想要<span class="hint">含这些字的标签不会被抽到</span></label><input class="input" id="rd-avoid" placeholder="例如：末世,死对头"></div>' +
      '<label class="check"><input type="checkbox" id="rd-keep" checked><span class="box"></span>保留已经选好的标签</label>',
    actions:[{label:'取消', value:null},{label:'抽', primary:true, collect:(m) => ({
      count: Math.max(1, Math.min(30, Number($('#rd-count', m).value) || 5)),
      cats: $$('#rd-cats .chip.on', m).map(c => c.dataset.cat),
      want: splitInput($('#rd-want', m).value),
      avoid: splitInput($('#rd-avoid', m).value),
      keep: $('#rd-keep', m).checked
    })}],
    onMount:(m) => { $$('#rd-cats .chip', m).forEach(c => c.addEventListener('click', () => c.classList.toggle('on'))); }
  });
  if(!setup) return;
  if(!setup.cats.length){ toast('至少选一个分类'); return; }
  const chosen = setup.keep ? storyTagList(Cur) : [];
  let result = drawTags({count:setup.count, cats:setup.cats, want:setup.want, avoid:setup.avoid, exclude:chosen});
  if(!result.length){ toast('这些条件下没有可抽的标签'); return; }
  const renderResult = (m) => {
    $('#rd-result', m).innerHTML = result.map((t, i) =>
      '<span class="chip on" data-i="' + i + '">' + esc(t) + '<span class="x" data-reroll="' + i + '" title="换一个">' + icon('refresh','sm') + '</span></span>').join('');
    $$('#rd-result [data-reroll]', m).forEach(b => b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const i = Number(b.dataset.reroll);
      const one = drawTags({count:1, cats:setup.cats, want:setup.want, avoid:setup.avoid, exclude:chosen.concat(result)});
      if(!one.length){ toast('没有更多可以换的标签了'); return; }
      result[i] = one[0]; renderResult(m);
    }));
  };
  const apply = await openModal({
    title:'抽到了这些',
    bodyHTML:'<div class="chips" id="rd-result"></div>' +
      '<div class="note mt12">点标签上的图标可以只重抽这一个。</div>',
    actions:[
      {label:'关闭', value:null},
      {label:'全部重抽', value:'again'},
      {label:'用这些', value:'apply', primary:true}
    ],
    onMount:(m) => renderResult(m)
  });
  if(apply === 'again'){ return randomDrawFlow(); }
  if(apply === 'apply'){
    if(!setup.keep){ Cur.tags = {}; Cur.customTags = []; }
    const all = Store.allTags();
    result.forEach(t => {
      const found = all.find(x => x.tag === t);
      if(found){
        if(!Cur.tags[found.cat]) Cur.tags[found.cat] = [];
        if(Cur.tags[found.cat].indexOf(t) < 0) Cur.tags[found.cat].push(t);
      }else if(Cur.customTags.indexOf(t) < 0) Cur.customTags.push(t);
    });
    await Store.saveStory(Cur);
    renderEditor();
    toast('已加入 ' + result.length + ' 个标签');
  }
}
function splitInput(str){
  return String(str || '').split(/[,，、;；\s]+/).map(trim).filter(Boolean);
}
