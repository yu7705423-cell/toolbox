<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工具箱">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="theme.css">
<title>工具箱</title>
<style>
/*
  合集页自己的排版。颜色一律从 theme.css 的 --tb-* 里取，
  这里不新发明任何色值 —— 纯黑白，要换皮就去改那个文件。

  卡片刻意压得很扁：一眼扫过去是「图标 + 名字」，说明只留一行，
  路径那种平时没人看的信息收进整理模式里。
*/
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--tb-bg);
  color:var(--tb-ink);
  font-family:var(--tb-font);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding:0 var(--tb-s4) calc(var(--tb-s6) + env(safe-area-inset-bottom));
  max-width:720px;
  margin:0 auto;
}

/* ---------- 顶部 ---------- */
header{
  padding:calc(var(--tb-s5) + env(safe-area-inset-top)) 0 var(--tb-s4);
  display:flex;align-items:flex-end;gap:var(--tb-s2);
}
.title{flex:1;min-width:0}
h1{margin:0;font-size:24px;line-height:1.2;font-weight:600;letter-spacing:.02em}
.sub{
  margin:2px 0 0;font-family:var(--tb-mono);
  font-size:10.5px;color:var(--tb-ink-faint);letter-spacing:.08em;
}
.icon-btn{
  flex:none;width:34px;height:34px;border:1px solid var(--tb-line-strong);
  border-radius:var(--tb-r-pill);background:var(--tb-surface);
  color:var(--tb-ink-soft);font-size:14px;line-height:1;
  display:grid;place-items:center;cursor:pointer;
  transition:background .12s,color .12s,border-color .12s;
}
.icon-btn:active{background:var(--tb-sunk)}
.icon-btn[aria-pressed="true"]{
  background:var(--tb-accent);border-color:var(--tb-accent);color:var(--tb-accent-ink);
}

/* ---------- 搜索 ---------- */
.search{position:relative;margin-bottom:var(--tb-s2)}
.search input{
  width:100%;padding:9px 12px 9px 32px;font-size:15px;
  font-family:inherit;color:var(--tb-ink);
  background:var(--tb-surface-2);border:1px solid transparent;
  border-radius:var(--tb-r-m);outline:none;transition:border-color .12s;
}
.search input:focus{border-color:var(--tb-line-strong);background:var(--tb-surface)}
.search input::placeholder{color:var(--tb-ink-faint)}
.search svg{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;stroke:var(--tb-ink-faint);fill:none;stroke-width:1.8;
}

/* ---------- 分栏标题 ---------- */
.sec{display:flex;align-items:center;gap:var(--tb-s3);margin:var(--tb-s5) 0 var(--tb-s3)}
.sec b{
  font-family:var(--tb-mono);font-size:10.5px;font-weight:500;
  letter-spacing:.16em;color:var(--tb-ink-faint);
}
.sec i{flex:1;height:1px;background:var(--tb-line)}

/* ---------- 卡片 ---------- */
.cards{display:grid;gap:var(--tb-s2);grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{
  display:flex;flex-direction:column;gap:6px;
  padding:var(--tb-s3);text-decoration:none;color:inherit;
  background:var(--tb-surface);border:1px solid var(--tb-line);
  border-radius:var(--tb-r-l);
  transition:transform .1s,border-color .12s;
}
.card:active{transform:scale(.985);border-color:var(--tb-line-strong)}
.head{display:flex;align-items:center;gap:9px;min-width:0}
.glyph{
  flex:none;width:28px;height:28px;border-radius:8px;
  display:grid;place-items:center;font-size:13px;font-weight:600;
  color:var(--tb-ink);border:1px solid var(--tb-line-strong);
}
/* 置顶的卡只有一个记号：图标反白。不加别的装饰 */
.card.pin .glyph{background:var(--tb-ink);color:var(--tb-bg);border-color:var(--tb-ink)}
.name{
  font-size:14px;font-weight:600;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.desc{
  font-size:11.5px;color:var(--tb-ink-soft);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.path{
  display:none;font-family:var(--tb-mono);font-size:10px;color:var(--tb-ink-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
body.editing .path{display:block}
.card.no-url{border-style:dashed}
.card.no-url .path{display:block;color:var(--tb-ink-soft)}

/* ---------- 整理模式 ---------- */
.card-tools{
  display:none;flex-wrap:wrap;gap:4px;margin-top:2px;
  padding-top:var(--tb-s2);border-top:1px solid var(--tb-line);
}
body.editing .card-tools{display:flex}
body.editing .card{cursor:default}
.card-tools button{
  flex:1 1 28px;padding:4px 0;font-size:10.5px;font-family:var(--tb-mono);
  color:var(--tb-ink-soft);background:var(--tb-surface-2);
  border:1px solid var(--tb-line);border-radius:var(--tb-r-s);cursor:pointer;
}
.card-tools button:active{background:var(--tb-sunk)}
.card-tools button.on{background:var(--tb-accent);border-color:var(--tb-accent);color:var(--tb-accent-ink)}
.add-tile{
  display:none;align-items:center;justify-content:center;
  min-height:72px;padding:var(--tb-s3);width:100%;margin-top:var(--tb-s3);
  border:1px dashed var(--tb-line-strong);border-radius:var(--tb-r-l);
  background:transparent;color:var(--tb-ink-soft);
  font-family:var(--tb-font);font-size:13px;cursor:pointer;
}
body.editing .add-tile{display:flex}

/* ---------- 底部 ---------- */
footer{
  margin-top:var(--tb-s6);padding-top:var(--tb-s4);
  border-top:1px solid var(--tb-line);
  font-family:var(--tb-mono);font-size:10.5px;color:var(--tb-ink-faint);
  letter-spacing:.04em;line-height:1.9;
}
footer .row{display:flex;flex-wrap:wrap;gap:var(--tb-s3);margin-bottom:var(--tb-s2)}
footer button{
  padding:0;font:inherit;color:var(--tb-ink-soft);
  background:none;border:none;border-bottom:1px solid var(--tb-line-strong);cursor:pointer;
}
footer button:active{color:var(--tb-ink)}
.empty-note{padding:var(--tb-s6) var(--tb-s4);text-align:center;color:var(--tb-ink-faint);font-size:13px}

/* ---------- 弹层 ---------- */
dialog{
  width:min(420px,calc(100vw - 32px));padding:0;
  color:var(--tb-ink);background:var(--tb-surface);
  border:1px solid var(--tb-line-strong);border-radius:var(--tb-r-l);
  box-shadow:var(--tb-shadow-2);
}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{padding:var(--tb-s5)}
.sheet h2{margin:0 0 var(--tb-s4);font-size:17px;font-weight:600}
label{display:block;margin-bottom:var(--tb-s3)}
label span,.field-label{
  display:block;margin-bottom:var(--tb-s1);
  font-family:var(--tb-mono);font-size:10px;letter-spacing:.1em;
  color:var(--tb-ink-faint);
}
label input{
  width:100%;padding:9px 11px;font-size:15px;font-family:inherit;
  color:var(--tb-ink);background:var(--tb-surface-2);
  border:1px solid var(--tb-line);border-radius:var(--tb-r-s);outline:none;
}
label input:focus{border-color:var(--tb-ink)}
.seg{display:flex;gap:var(--tb-s2);margin-bottom:var(--tb-s3)}
.seg button{
  flex:1;padding:8px;font-size:13px;font-family:inherit;cursor:pointer;
  color:var(--tb-ink-soft);background:var(--tb-surface-2);
  border:1px solid var(--tb-line);border-radius:var(--tb-r-s);
}
.seg button[aria-pressed="true"]{
  background:var(--tb-accent);border-color:var(--tb-accent);
  color:var(--tb-accent-ink);font-weight:600;
}
.sheet-actions{display:flex;gap:var(--tb-s2);margin-top:var(--tb-s5)}
.sheet-actions button{
  flex:1;padding:10px;font-size:14px;font-family:inherit;
  border-radius:var(--tb-r-s);cursor:pointer;
  border:1px solid var(--tb-line-strong);
  background:var(--tb-surface);color:var(--tb-ink);
}
.sheet-actions .primary{
  background:var(--tb-accent);border-color:var(--tb-accent);
  color:var(--tb-accent-ink);font-weight:600;
}

/* ---------- 吐司 ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));
  transform:translate(-50%,8px);
  padding:7px 14px;font-size:12.5px;
  background:var(--tb-ink);color:var(--tb-bg);
  border-radius:var(--tb-r-pill);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header>
  <div class="title">
    <h1>工具箱</h1>
    <p class="sub" id="count"></p>
  </div>
  <button class="icon-btn" id="theme-btn" title="日夜">◐</button>
  <button class="icon-btn" id="edit-btn" title="整理" aria-pressed="false">✎</button>
</header>

<div class="search">
  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
  <input id="q" type="search" placeholder="找工具" autocomplete="off" enterkeyhint="search">
</div>

<main id="main"></main>
<button class="add-tile" id="add-btn">＋　添加一个</button>

<footer>
  <div class="row">
    <button id="export-btn">导出配置</button>
    <button id="import-btn">导入配置</button>
    <button id="reset-btn">恢复默认</button>
    <span id="hidden-note"></span>
  </div>
  <div>整理模式（右上 ✎）里能改地址、置顶、换栏、调顺序。配置只存在这台设备上，换手机记得先导出一份。</div>
</footer>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="toast"></div>

<dialog id="sheet">
  <form class="sheet" id="sheet-form" method="dialog">
    <h2 id="sheet-title">编辑</h2>
    <label><span>名字</span><input id="f-name" required maxlength="20"></label>
    <label><span>一句话说明</span><input id="f-desc" maxlength="40" placeholder="短一点，卡片上只留一两行"></label>
    <label><span>网址</span><input id="f-url" type="url" inputmode="url" placeholder="https://"></label>
    <label><span>图标（一个字或 emoji）</span><input id="f-glyph" maxlength="2"></label>
    <div class="field-label">放哪一栏</div>
    <div class="seg" id="f-group">
      <button type="button" data-group="diy">DIY</button>
      <button type="button" data-group="stash">收纳</button>
    </div>
    <div class="field-label">置顶</div>
    <div class="seg" id="f-pin">
      <button type="button" data-pin="1">置顶</button>
      <button type="button" data-pin="0">不置顶</button>
    </div>
    <div class="sheet-actions">
      <button type="button" id="sheet-cancel">取消</button>
      <button type="button" id="sheet-delete">删除</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<script>
/* =====================================================================
   内置的工具清单 —— 出厂设置。
   代码里加一条，所有设备下次打开都会多一张卡；
   在页面上改过的字段存在本地覆盖层里，不会被这里的改动冲掉。

   group：'diy' 是拿来做东西的，'stash' 是拿来存东西的。
   desc  ：越短越好，卡片上最多两行，写长了会被截断。
   ===================================================================== */
const PAGES = 'https://yu7705423-cell.github.io';

const BUILTIN = [
  { id:'fanwai',  name:'番外生成器',    glyph:'番', group:'diy',
    desc:'选几个梗，产出一段 Prompt',   url:PAGES+'/fanwai/' },

  { id:'imgtest', name:'图床工具箱',    glyph:'图', group:'diy',
    desc:'自建图床的上传和管理',        url:PAGES+'/imgtest/imagehosttoolkit.html' },

  { id:'wbgen',   name:'世界书生成器',  glyph:'世', group:'diy',
    desc:'写世界书，带审查、评分和修订',  url:PAGES+'/toolbox/worldbook/' },

  { id:'read',    name:'喵喵书阁',      glyph:'书', group:'stash',
    desc:'存番外和长篇，能朗读',        url:PAGES+'/read/' },

  { id:'memory',  name:'Chat Archive',  glyph:'档', group:'stash',
    desc:'JSON 备份当聊天记录翻',       url:PAGES+'/memory/chat-archive.html' },

  { id:'wblib',   name:'世界书库',      glyph:'库', group:'stash',
    desc:'世界书的存放、导入导出和备份',  url:PAGES+'/toolbox/worldbook/library.html' },
];

const GROUPS = [
  { key:'pin',   label:'置顶' },
  { key:'diy',   label:'DIY' },
  { key:'stash', label:'收纳' },
];

/* =====================================================================
   本地状态：只存「和出厂设置的差异」。
   ===================================================================== */
const STORE = 'toolbox.v1';
const blank = () => ({theme:'auto', order:[], hidden:[], pinned:[], overrides:{}, custom:[]});

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return blank();
    // 老版本存下来的配置没有 pinned 这些字段，用 blank() 兜住
    return Object.assign(blank(), JSON.parse(raw));
  }catch(e){
    // 隐私模式 / 清过站点数据 / 存储被拦：一律当没存过，页面照样能用
    return blank();
  }
}
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }
  catch(e){ toast('这台设备存不了配置，改动只在本次有效'); }
}

/* 出厂卡片 + 本地覆盖 + 自定义卡片，按保存的顺序拼成一张总表 */
function tools(){
  const merged = BUILTIN.map(t => Object.assign({builtin:true}, t, state.overrides[t.id] || {}))
    .concat(state.custom.map(t => Object.assign({builtin:false, group:'diy'}, t)));
  const rank = id => {
    const i = state.order.indexOf(id);
    return i === -1 ? 1e6 : i;   // 没排过序的排在后面，保持出厂顺序
  };
  return merged.sort((a,b) => rank(a.id) - rank(b.id));
}
function visible(){ return tools().filter(t => !state.hidden.includes(t.id)); }
function isPinned(id){ return state.pinned.includes(id); }

/* 分栏：置顶 / DIY / 收纳。置顶的卡从原来那栏里拿走，不重复出现 */
function sections(){
  const v = visible();
  return GROUPS.map(g => ({
    key:g.key, label:g.label,
    items: g.key === 'pin'
      ? v.filter(t => isPinned(t.id))
      : v.filter(t => !isPinned(t.id) && (t.group || 'diy') === g.key)
  })).filter(s => s.items.length);
}

/* =====================================================================
   渲染
   ===================================================================== */
const main = document.getElementById('main');
const qInput = document.getElementById('q');

function pathOf(url){
  if(!url) return '地址还没填';
  try{
    const u = new URL(url);
    // 自己的东西全在同一个域名下，显示域名没信息量，直接给路径
    if(u.hostname === new URL(PAGES).hostname) return u.pathname;
    return (u.hostname + u.pathname).replace(/\/$/,'');
  }catch(e){ return url; }
}

function render(){
  const kw = qInput.value.trim().toLowerCase();
  main.innerHTML = '';

  // 搜索时不分栏，直接平铺结果 —— 找东西的时候分类只会碍事
  const groups = kw
    ? [{key:'hit', label:'', items: visible().filter(t =>
        (t.name + ' ' + (t.desc||'')).toLowerCase().includes(kw))}]
    : sections();

  const total = groups.reduce((n,g) => n + g.items.length, 0);
  if(!total){
    const p = document.createElement('p');
    p.className = 'empty-note';
    p.textContent = kw ? '没有叫这个名字的' : '一个都没有了，按右上角 ✎ 再「＋ 添加一个」';
    main.appendChild(p);
  }

  groups.forEach(g => {
    if(g.label){
      const h = document.createElement('div');
      h.className = 'sec';
      h.innerHTML = '<b>' + g.label + '</b><i></i>';
      main.appendChild(h);
    }
    const wrap = document.createElement('div');
    wrap.className = 'cards';
    g.items.forEach((t, i) => wrap.appendChild(card(t, i, g.items.length)));
    main.appendChild(wrap);
  });

  const n = visible().length, h = state.hidden.length;
  document.getElementById('count').textContent =
    `${n} 个工具` + (h ? ` · 藏了 ${h} 个` : '');
  document.getElementById('hidden-note').innerHTML = h
    ? `<button id="unhide-btn">放出藏起来的 ${h} 个</button>` : '';
  const un = document.getElementById('unhide-btn');
  if(un) un.onclick = () => { state.hidden = []; save(); render(); };
}

function card(t, i, len){
  const el = document.createElement('a');
  el.className = 'card' + (isPinned(t.id) ? ' pin' : '') + (t.url ? '' : ' no-url');
  el.href = t.url || '#';
  // 加到主屏幕后是独立窗口，_blank 会把人甩回 Safari，所以那种情况原地跳
  if(t.url && !matchMedia('(display-mode:standalone)').matches){
    el.target = '_blank';
    el.rel = 'noopener';
  }
  el.innerHTML = `
    <div class="head">
      <div class="glyph">${esc(t.glyph || t.name.slice(0,1))}</div>
      <div class="name">${esc(t.name)}</div>
    </div>
    ${t.desc ? `<div class="desc">${esc(t.desc)}</div>` : ''}
    <div class="path">${esc(pathOf(t.url))}</div>
    <div class="card-tools"></div>`;

  const bar = el.querySelector('.card-tools');
  bar.append(
    btn('改', () => openSheet(t.id)),
    btn('顶', () => togglePin(t.id), false, isPinned(t.id)),
    btn('藏', () => { state.hidden.push(t.id); save(); render(); toast('藏起来了'); }),
    btn('↑', () => move(t.id, -1), i === 0),
    btn('↓', () => move(t.id, 1), i === len - 1),
  );

  el.addEventListener('click', e => {
    const editing = document.body.classList.contains('editing');
    if(editing || !t.url) e.preventDefault();
    if(!editing && !t.url){
      openSheet(t.id);
      toast('这张卡还没填地址');
    }
  });
  return el;
}

function btn(text, fn, disabled, on){
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = text;
  if(on) b.className = 'on';
  if(disabled){ b.disabled = true; b.style.opacity = .3; }
  b.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    if(!disabled) fn();
  });
  return b;
}

function togglePin(id){
  const i = state.pinned.indexOf(id);
  if(i === -1) state.pinned.push(id); else state.pinned.splice(i, 1);
  save(); render();
  toast(i === -1 ? '置顶了' : '取消置顶');
}

/* ↑↓ 只在本栏里挪，不会跨栏乱跑 */
function move(id, delta){
  const sec = sections().find(s => s.items.some(t => t.id === id));
  if(!sec) return;
  const ids = sec.items.map(t => t.id);
  const i = ids.indexOf(id), j = i + delta;
  if(j < 0 || j >= ids.length) return;
  // 先把完整顺序写实（含藏起来的），再把这两张卡的位置对调
  const full = tools().map(t => t.id);
  const a = full.indexOf(id), b = full.indexOf(ids[j]);
  [full[a], full[b]] = [full[b], full[a]];
  state.order = full;
  save(); render();
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =====================================================================
   编辑 / 添加弹层
   ===================================================================== */
const sheet = document.getElementById('sheet');
const fName = document.getElementById('f-name');
const fDesc = document.getElementById('f-desc');
const fUrl = document.getElementById('f-url');
const fGlyph = document.getElementById('f-glyph');
const groupBox = document.getElementById('f-group');
const pinBox = document.getElementById('f-pin');
let editingId = null, pickedGroup = 'diy', pickedPin = false;

groupBox.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  pickedGroup = b.dataset.group; paintSeg();
});
pinBox.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  pickedPin = b.dataset.pin === '1'; paintSeg();
});
function paintSeg(){
  [...groupBox.children].forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.group === pickedGroup)));
  [...pinBox.children].forEach(b =>
    b.setAttribute('aria-pressed', String((b.dataset.pin === '1') === pickedPin)));
}

function openSheet(id){
  editingId = id;
  const t = id ? tools().find(x => x.id === id) : null;
  document.getElementById('sheet-title').textContent = t ? '编辑 ' + t.name : '添加一个';
  fName.value = t ? t.name : '';
  fDesc.value = t ? (t.desc || '') : '';
  fUrl.value = t ? (t.url || '') : '';
  fGlyph.value = t ? (t.glyph || '') : '';
  pickedGroup = t ? (t.group || 'diy') : 'diy';
  pickedPin = t ? isPinned(t.id) : false;
  paintSeg();
  // 出厂卡片不能删，只能藏 —— 删了代码里还在，下次打开又回来，反而更困惑
  document.getElementById('sheet-delete').style.display = (t && !t.builtin) ? '' : 'none';
  sheet.showModal();
}

document.getElementById('sheet-form').addEventListener('submit', e => {
  e.preventDefault();
  const patch = {
    name: fName.value.trim() || '未命名',
    desc: fDesc.value.trim(),
    url: fUrl.value.trim(),
    glyph: fGlyph.value.trim(),
    group: pickedGroup,
  };
  let id = editingId;
  if(id){
    const t = tools().find(x => x.id === id);
    if(t.builtin){
      state.overrides[id] = Object.assign({}, state.overrides[id], patch);
    }else{
      Object.assign(state.custom.find(x => x.id === id), patch);
    }
  }else{
    id = 'c' + Date.now().toString(36);
    state.custom.push(Object.assign({id}, patch));
  }
  const pinnedNow = isPinned(id);
  if(pickedPin && !pinnedNow) state.pinned.push(id);
  if(!pickedPin && pinnedNow) state.pinned.splice(state.pinned.indexOf(id), 1);

  save(); sheet.close(); render(); toast('存好了');
});
document.getElementById('sheet-cancel').onclick = () => sheet.close();
document.getElementById('sheet-delete').onclick = () => {
  state.custom = state.custom.filter(x => x.id !== editingId);
  state.order = state.order.filter(x => x !== editingId);
  state.pinned = state.pinned.filter(x => x !== editingId);
  save(); sheet.close(); render(); toast('删掉了');
};

/* =====================================================================
   顶部按钮 / 导入导出
   ===================================================================== */
document.getElementById('add-btn').onclick = () => openSheet(null);

const editBtn = document.getElementById('edit-btn');
editBtn.onclick = () => {
  const on = document.body.classList.toggle('editing');
  editBtn.setAttribute('aria-pressed', String(on));
};

const themeBtn = document.getElementById('theme-btn');
const THEMES = ['auto','light','dark'];
const THEME_LABEL = {auto:'◐', light:'☀', dark:'☾'};
function applyTheme(){
  const t = state.theme;
  if(t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = THEME_LABEL[t];
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  document.querySelector('meta[name=theme-color]').content = dark ? '#000000' : '#FFFFFF';
}
themeBtn.onclick = () => {
  state.theme = THEMES[(THEMES.indexOf(state.theme) + 1) % 3];
  save(); applyTheme();
};
// 跟随系统的时候，系统半夜自己切了也要跟上
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => {
  if(state.theme === 'auto') applyTheme();
});

document.getElementById('export-btn').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'toolbox-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

const importFile = document.getElementById('import-file');
document.getElementById('import-btn').onclick = () => importFile.click();
importFile.onchange = async () => {
  const f = importFile.files[0];
  if(!f) return;
  try{
    state = Object.assign(blank(), JSON.parse(await f.text()));
    save(); applyTheme(); render(); toast('导进来了');
  }catch(e){ toast('这个文件读不了'); }
  importFile.value = '';
};

document.getElementById('reset-btn').onclick = () => {
  if(!confirm('恢复默认？自己加的卡片、改过的地址和置顶都会没有。')) return;
  state = blank(); save(); applyTheme(); render(); toast('回到出厂了');
};

qInput.addEventListener('input', render);

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

applyTheme();
render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
